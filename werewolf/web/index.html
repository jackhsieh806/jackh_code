<title>狼人殺練習場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* 版面：單欄、手機優先。上方座位盤 → 中間對局紀錄（可捲動）→ 下方固定行動面板 */
:root {
  --bg: #eceef4;
  --surface: #ffffff;
  --sunken: #e2e5ee;
  --ink: #1b1e31;
  --muted: #5b6181;
  --line: #d0d4e2;
  --accent: #9b2a24;
  --accent-ink: #ffffff;
  --night: #2f3a78;
  --night-soft: #dfe3f6;
  --good: #23704c;
  --good-soft: #dcefe5;
  --wolf: #a92d27;
  --wolf-soft: #f6dedc;
  --gold: #8f6614;
  --display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10121d; --surface: #191c2c; --sunken: #0b0d16; --ink: #e6e8f2; --muted: #979dbb;
    --line: #2b2f47; --accent: #e06a58; --accent-ink: #1a0d0b; --night: #a8b6f4; --night-soft: #22284a;
    --good: #6cc79a; --good-soft: #17322a; --wolf: #f07d70; --wolf-soft: #3a1c1c; --gold: #e0b858;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10121d; --surface: #191c2c; --sunken: #0b0d16; --ink: #e6e8f2; --muted: #979dbb;
  --line: #2b2f47; --accent: #e06a58; --accent-ink: #1a0d0b; --night: #a8b6f4; --night-soft: #22284a;
  --good: #6cc79a; --good-soft: #17322a; --wolf: #f07d70; --wolf-soft: #3a1c1c; --gold: #e0b858;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 40px; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.3; }
h1 { font-size: 1.75rem; font-weight: 900; letter-spacing: .04em; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand small { color: var(--muted); font-size: .85rem; }
.tabs { display: flex; gap: 4px; background: var(--sunken); padding: 4px; border-radius: 12px; }
.tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 8px 6px; border-radius: 9px; font: 500 .95rem var(--body); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
button { font-family: var(--body); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--night); outline-offset: 2px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.label { font-size: .75rem; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 12px; border-radius: 999px; font-size: .92rem; cursor: pointer; min-height: 38px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.good[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--surface); }
.chip.wolf[aria-pressed="true"] { background: var(--wolf); border-color: var(--wolf); color: var(--surface); }
.boards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.board { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.board b { font-family: var(--display); font-size: 1rem; }
.board span { color: var(--muted); font-size: .85rem; }
.board[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.steppers { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; }
.stepper { display: grid; grid-template-columns: 1fr 34px 26px 34px; align-items: center; gap: 4px; }
.stepper span { min-width: 0; }
.stepper b { text-align: center; font-variant-numeric: tabular-nums; }
.stepper button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; height: 34px; font-size: 1.1rem; cursor: pointer; }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper .wolfname { color: var(--wolf); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 200px; min-width: 0; }
select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
.primary:disabled { opacity: .45; cursor: default; }
.primary { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1rem; padding: 12px 18px; border-radius: 10px; cursor: pointer; }
.secondary { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 14px; border-radius: 10px; cursor: pointer; font-size: .95rem; }
.hint { color: var(--muted); font-size: .88rem; }

/* 對局 */
.me { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: var(--radius); background: var(--night-soft); border: 1px solid var(--line); }
.me .role { font-family: var(--display); font-size: 1.15rem; font-weight: 900; }
.me .role.wolfside { color: var(--wolf); }
.me .role.goodside { color: var(--good); }
.me .info { font-size: .88rem; color: var(--muted); }
.seats { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
.seat { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 4px 5px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1px; min-height: 66px; }
.seat .no { font-family: var(--display); font-weight: 900; font-size: 1.3rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.seat .tag { font-size: .7rem; line-height: 1.3; color: var(--muted); }
.seat .tag.wolf { color: var(--wolf); font-weight: 700; }
.seat .tag.good { color: var(--good); font-weight: 700; }
.seat .tag.claim { color: var(--gold); }
.seat.you { border-color: var(--night); box-shadow: inset 0 0 0 1px var(--night); }
.seat.dead { background: var(--sunken); opacity: .6; }
.seat.dead .no { text-decoration: line-through; }
.log { list-style: none; margin: 0; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); height: min(40vh, 460px); overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.log li { font-size: .92rem; overflow-wrap: anywhere; }
.log .phase { margin-top: 8px; padding: 6px 10px; border-radius: 8px; font-family: var(--display); font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.log .phase:first-child { margin-top: 0; }
.log .phase.night { background: var(--night-soft); color: var(--night); }
.log .phase.day { background: var(--sunken); color: var(--ink); }
.log .phase small { font-family: var(--body); font-weight: 400; color: var(--muted); }
.log .speech { display: grid; grid-template-columns: 38px 1fr; gap: 8px; align-items: start; }
.log .speech .who { font-family: var(--display); font-weight: 900; text-align: right; font-variant-numeric: tabular-nums; }
.log .speech.last .who { color: var(--muted); }
.log .speech.last .what::before { content: "遺言　"; color: var(--muted); font-size: .8rem; }
.log .speech.mine .what { color: var(--night); font-weight: 500; }
.log .sub { font-size: .78rem; letter-spacing: .1em; color: var(--muted); font-weight: 700; margin-top: 4px; }
.log .vote { font-variant-numeric: tabular-nums; padding-left: 10px; border-left: 2px solid var(--line); }
.log .event { font-weight: 700; }
.log .secret { color: var(--muted); font-size: .84rem; padding-left: 10px; border-left: 2px dashed var(--night); }
.log .private { color: var(--night); background: var(--night-soft); padding: 6px 10px; border-radius: 8px; font-size: .9rem; }
.action { scroll-margin-bottom: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -6px 18px rgb(0 0 0 / .08); }
.action .title { font-family: var(--display); font-weight: 700; font-size: 1.05rem; }
.action .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.seatpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
.seatpick button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px; min-height: 46px; font: 900 1.1rem var(--display); cursor: pointer; font-variant-numeric: tabular-nums; }
.seatpick button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seatpick button.good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.seatpick button.wolf { background: var(--wolf-soft); border-color: var(--wolf); color: var(--wolf); }
.seatpick button small { display: block; font: 500 .65rem var(--body); }
input[type="text"] { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
.toggle { display: flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); }

/* 結果與復盤 */
.banner { padding: 16px; border-radius: var(--radius); text-align: center; display: flex; flex-direction: column; gap: 4px; }
.banner.GOOD { background: var(--good-soft); color: var(--good); }
.banner.WOLF { background: var(--wolf-soft); color: var(--wolf); }
.banner.DRAW { background: var(--sunken); }
.banner h2 { font-size: 1.5rem; font-weight: 900; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .75rem; letter-spacing: .1em; color: var(--muted); }
.w { color: var(--wolf); font-weight: 700; }
.g { color: var(--good); font-weight: 700; }
.godlog { margin: 0; padding-left: 1.2em; font-size: .88rem; display: flex; flex-direction: column; gap: 2px; }
.votes { display: flex; flex-direction: column; gap: 6px; font-size: .88rem; }
.votes .pair { display: inline-block; margin-right: 10px; white-space: nowrap; }

/* 測驗 */
.q { font-family: var(--display); font-size: 1.1rem; font-weight: 700; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 12px 14px; border-radius: 10px; font-size: .95rem; cursor: pointer; }
.opt.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 700; }
.opt.wrong { border-color: var(--wolf); background: var(--wolf-soft); color: var(--wolf); }
.explain { background: var(--sunken); border-radius: 10px; padding: 10px 12px; font-size: .92rem; }
.progress { height: 4px; background: var(--sunken); border-radius: 4px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }

/* 速查 */
.sheet { display: flex; flex-direction: column; gap: 14px; }
.sheet ol, .sheet ul { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; max-width: 65ch; }
.terms { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
.terms dt { font-family: var(--display); font-weight: 700; color: var(--accent); }
.terms dd { margin: 0; min-width: 0; }
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .9rem; }
.flow span { padding: 4px 10px; border-radius: 999px; background: var(--night-soft); color: var(--night); }
.flow i { color: var(--muted); font-style: normal; }
@media (prefers-reduced-motion: no-preference) {
  .log li { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(4px); opacity: .4; } to { transform: none; opacity: 1; } }
}
</style>

<div class="wrap">
  <header class="brand">
    <h1>狼人殺練習場</h1>
    <small>和電腦對局、觀戰、做規則測驗</small>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-btn-play" aria-selected="true" data-tab="play">對局</button>
    <button role="tab" id="tab-btn-quiz" aria-selected="false" data-tab="quiz">測驗</button>
    <button role="tab" id="tab-btn-sheet" aria-selected="false" data-tab="sheet">速查</button>
  </nav>

  <section id="tab-play" class="tabpane">
    <div id="setup" class="panel">
      <div class="field">
        <span class="label">模式</span>
        <div class="chips" id="mode-chips">
          <button class="chip" id="mode-play" aria-pressed="true" data-mode="play">親自下場</button>
          <button class="chip" id="mode-watch" aria-pressed="false" data-mode="watch">觀戰（全電腦）</button>
        </div>
      </div>
      <div class="field">
        <span class="label">板子</span>
        <div class="boards" id="boards"></div>
      </div>
      <div class="field" id="custom-field" hidden>
        <span class="label">自訂每個角色的數量</span>
        <div class="steppers" id="steppers"></div>
        <span class="hint" id="custom-sum"></span>
      </div>
      <div class="field" id="role-field">
        <span class="label">你的身份</span>
        <div class="chips" id="role-chips"></div>
      </div>
      <label class="toggle" id="god-field" hidden><input type="checkbox" id="god-view" checked> 開啟上帝視角（看得到每晚的行動）</label>
      <div class="field">
        <span class="label">規則（開局前記得問主持人）</span>
        <div class="row">
          <label class="field"><span class="hint">女巫自救</span>
            <select id="rule-self-save">
              <option value="first_night">僅首夜可自救</option>
              <option value="never">全程不可自救</option>
              <option value="always">隨時可自救</option>
            </select></label>
          <label class="field"><span class="hint">同守同救</span>
            <select id="rule-sgs">
              <option value="1">會死亡</option>
              <option value="0">不會死亡</option>
            </select></label>
          <label class="field"><span class="hint">警長競選</span>
            <select id="rule-sheriff">
              <option value="1">有（第一天競選）</option>
              <option value="0">沒有</option>
            </select></label>
          <label class="field"><span class="hint">狼人自爆</span>
            <select id="rule-explode">
              <option value="1">可以自爆</option>
              <option value="0">不可以</option>
            </select></label>
          <label class="field"><span class="hint">勝利條件</span>
            <select id="rule-win">
              <option value="side">屠邊（殺光平民或神職）</option>
              <option value="all">屠城（殺光所有好人）</option>
            </select></label>
        </div>
      </div>
      <button class="primary" id="start">開始對局</button>
      <p class="hint">電腦狼人會悍跳預言家、發假查殺、統一投票；好人電腦會找矛盾、看票型。警長競選與狼人自爆可以在上面關掉。</p>
    </div>

    <div id="arena" hidden>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="me" id="me"></div>
        <div class="seats" id="seats"></div>
        <ol class="log" id="log" aria-live="polite"></ol>
        <div class="action" id="action"></div>
      </div>
    </div>

    <div id="result" hidden></div>
  </section>

  <section id="tab-quiz" class="tabpane" hidden>
    <div class="panel" id="quiz"></div>
  </section>

  <section id="tab-sheet" class="tabpane" hidden>
    <div class="panel sheet" id="sheet"></div>
  </section>
</div>

<script>
"use strict";
// ================================================================ 角色與板子
const R = { WEREWOLF: "狼人", WOLF_KING: "狼王", AWAKENED: "覺醒狼王", WOLF_BEAUTY: "狼美人", TIGER: "虎姑婆", WILD_CHILD: "野孩子", SEER: "預言家", LANTERN: "燈影預言家", WITCH: "女巫", HUNTER: "獵人", GUARD: "守衛", IDIOT: "白痴", DREAMER: "攝夢人", MERCHANT: "奇蹟商人", KNIGHT: "騎士", VILLAGE_GIRL: "村姑", VILLAGER: "平民" };
const ROLE_ORDER = Object.keys(R);
// 真狼：好人要全部放逐才算贏（轉狼的野孩子不用出局）
const WOLVES = new Set(["WEREWOLF", "WOLF_KING", "AWAKENED", "WOLF_BEAUTY", "TIGER"]);
// 神職；村姑和野孩子既不是神職也不是平民，屠邊時不算任何一邊
const GODS = new Set(["SEER", "WITCH", "HUNTER", "GUARD", "IDIOT", "DREAMER", "MERCHANT", "KNIGHT"]);
const ITEMS = { check: "查驗", poison: "毒藥", guard: "守護" };
const TEAM_NAME = { GOOD: "好人陣營", WOLF: "狼人陣營" };
const DESC = {
  WEREWOLF: "每晚和狼隊友殺一個人。白天要隱藏身份，可以假冒神職（悍跳）。",
  SEER: "每晚查驗一名玩家是好人還是狼人，是好人陣營的資訊核心。（燈影預言家板：預言家牌站神坑，但查驗可能是反的。）",
  LANTERN: "站民坑的另一位預言家，每晚也能查驗。開局時主持人決定預言家牌和燈影預言家牌哪張正確查驗、另一張反向，兩人都不知道自己是哪種。不能驗自己、翻牌騎士和騎金。",
  WITCH: "一瓶解藥、一瓶毒藥各用一次；同一晚只能用一瓶。解藥用掉後看不到刀口。",
  HUNTER: "被狼殺或被放逐時可以開槍帶走一人；被毒死不能開槍。",
  GUARD: "每晚守護一人不被狼殺，不能連續兩晚守同一人。同守同救仍會死。",
  IDIOT: "白天被放逐時翻牌免死，但之後不能投票；晚上被殺正常死亡。",
  WOLF_KING: "狼人的一員。被放逐或晚上出局時可發動狼王爪帶走一人；被毒、夢遊出局不能。",
  AWAKENED: "狼人的一員，有兩次狼王爪。晚上可親傳一爪給狼隊友（每晚一次、每人最多一次），剩下的出局時全部可用。被毒、夢遊出局不能發動。",
  DREAMER: "每晚必選一人夢遊（不能選自己），夢遊者當晚不怕狼刀和毒藥。連續兩晚同一人會讓他出局；你晚上死亡時夢遊者也一起出局。",
  MERCHANT: "整局一次：晚上把查驗、毒藥或守護交給一人（幸運兒），他當晚就能用一次。交給狼人的話對方拿不到，你天亮出局。",
  WOLF_BEAUTY: "狼人的一員。每晚可迷魅一人（不能連續兩晚同一人）；你出局時，被迷魅的人一同出局。不能自爆、不能被自刀；被騎士決鬥出局時技能被封。",
  TIGER: "狼人的一員。【誘導】第二晚起每隔一晚：選一個號碼，預言家和村姑當晚只能驗這個號碼和左右兩人，新範圍不能和上次重疊；野孩子入狼隊時整局只能用一次。【惡靈反傷】整局一次：被村姑驗、預言家驗或女巫毒時，使用技能的人出局（村姑 > 預言家 > 女巫）。",

class Game {

    for (const p of this.players) if (p.role === "WOLF_KING" || p.role === "AWAKENED") this.claws[p.seat] = p.role === "AWAKENED" ? 2 : 1;

  p(s) { return this.players[s - 1]; }
  alive() { return this.players.filter(p => p.alive); }

  aliveWithRole(r) { return this.alive().find(p => p.role === r) || null; }

  claimedRole(s) { return this.claims.get(s)?.role ?? null; }
  seerClaims() {

  }
  // 目前陣營：野孩子看榜樣與是否轉狼
  alignment(p) {

    }
    rec.deaths = Game.resolveNight(rec.kill, rec.guard, rec.saved, rec.poison, this.rules.sameGuardSaveDies,
      { extraGuard: luckyGuard, extraPoison: luckyPoison, dream, dreamRepeat, dreamer: dreamer ? dreamer.seat : null, tradeDeath });
    if (reflectDeath != null && !rec.deaths.has(reflectDeath)) rec.deaths.set(reflectDeath, "reflect");
    const bty = this.aliveWithRole("WOLF_BEAUTY");
    if (bty && rec.deaths.has(bty.seat) && alive.has(this.charm) && !rec.deaths.has(this.charm)) rec.deaths.set(this.charm, "charm");
    for (const [s, c] of rec.deaths) await this.markDead(s, c);
    this.nights.push(rec);
    return rec;
  }

  async runDawn(rec) {
    const n = this.nightNo;
    this.days.push({ day: n, speeches: [], votes: new Map(), pkVotes: new Map(), exiled: null, events: [], exploded: null });
    this.io.phase("day", `第 ${n} 天`, "天亮了");
    if (n === 1 && this.rules.sheriff) await this.runElection();  // 先競選警長，再公布死訊
    const dead = [...rec.deaths.keys()].sort(bySeat);
    this.say(dead.length ? `昨晚死亡的是：${dead.map(s => s + "號").join("、")}` : "昨晚是平安夜，沒有人死亡。", "event");
    this.io.update(this);
    let w = this.checkWinner();
    if (w) return w;
    for (const s of dead) {
      if (n === 1) await this.lastWords(s);
      await this.deathTrigger(s, rec.deaths.get(s));
      if ((w = this.checkWinner())) return w;
    }
    await this.badgeCheck();
    await this.io.pause("開始發言");
    return null;
  }

  // ---------------------------------------------------------------- 警長與自爆
  async runElection() {
    this.phase = "election";
    this.say("警長競選", "sub");
    const seats = this.players.map(p => p.seat);
    const running = [];
    for (const s of seats) if (await this.ctrl[s].runForSheriff(this, this.p(s))) running.push(s);
    if (!running.length || running.length === seats.length) {
      this.say(running.length ? "全員上警，沒有人能投票，警徽流失。" : "沒有人上警，警徽流失。", "event");
      this.sheriffLog.push("警徽流失（無人可選）");
      this.phase = "day"; return;
    }
    this.say(`上警：${running.join("、")}號`);
    for (const s of running) {
      const p = this.p(s);
      if (await this.tryExplode(p)) {
        this.say("警長競選中有人自爆，警徽流失。", "event");
        this.sheriffLog.push(`${s}號 警上自爆，警徽流失`);
        this.phase = "day"; return;
      }
      const sp = await this.ctrl[s].speak(this, p);
      sp.seat = s;
      this.registerSpeech(sp);
      this.say("（警上）" + renderSpeech(sp), "speech", s);
    }
    const voters = seats.filter(s => !running.includes(s));
    this.say("警長投票（警下玩家投票）", "sub");
    let votes = await this.collectVotes(running, voters, true);
    this.sheriffVotes = new Map(votes);
    let leaders = this.showVotes(votes, false);
    if (leaders.length > 1) {
      this.say(`平票！${leaders.join("、")}號 PK，警下玩家重新投票。`, "event");
      votes = await this.collectVotes(leaders, voters, true);
      for (const [v, t] of votes) if (t != null) this.sheriffVotes.set(v, t);
      leaders = this.showVotes(votes, false);
    }
    if (leaders.length !== 1) { this.say("沒有人勝出，警徽流失。", "event"); this.sheriffLog.push("警徽流失（平票）"); }
    else {
      this.sheriff = leaders[0];
      this.sheriffLog.push(`第 1 天 ${this.sheriff}號 當選警長`);
      this.say(`${this.sheriff}號 當選警長！投票算 1.5 票，決定發言方向並最後發言。`, "event");
    }
    this.phase = "day";
  }
  async badgeCheck() {
    const s = this.sheriff;
    if (s == null || this.p(s).alive) return;
    const t = await this.ctrl[s].passBadge(this, this.p(s));
    if (t != null && t !== s && this.p(t)?.alive) {
      this.sheriff = t;
      this.sheriffLog.push(`第 ${this.nightNo} 天 ${s}號 把警徽移交給 ${t}號`);
      this.say(`警長 ${s}號 把警徽移交給 ${t}號。`, "event");
    } else {
      this.sheriff = null;
      this.sheriffLog.push(`第 ${this.nightNo} 天 ${s}號 撕掉警徽`);
      this.say(`警長 ${s}號 撕掉了警徽，之後沒有警長。`, "event");
    }
    this.io.update(this);
  }
  // 狼人自爆：立即出局、沒有遺言，當天剩下的流程跳過；狼王自爆可以帶人
  async tryExplode(p) {
    if (!(this.rules.selfExplode && p.alive && isWolf(p)) || p.role === "WOLF_BEAUTY") return false;  // 狼美人不能自爆
    if (!(await this.ctrl[p.seat].selfExplode(this, p))) return false;
    p.revealed = true;
    await this.kill(p.seat, "explode");
    this.today.exploded = p.seat;
    this.today.events.push(`${p.seat}號 自爆`);
    this.say(`${p.seat}號 自爆！翻牌【${R[p.role]}】，今天的發言與投票全部跳過。`, "event");
    if (this.phase !== "election") this.io.update(this);
    await this.deathTrigger(p.seat, "explode");
    return true;
  }

  // 有警長：警長選方向（警右往大號、警左往小號），自己最後發言；沒有警長就輪流起頭
  async speechOrder() {
    const seats = this.aliveSeats();
    if (this.sheriff != null && seats.includes(this.sheriff)) {
      const sp = this.sheriff;
      const dir = await this.ctrl[sp].chooseDirection(this, this.p(sp));
      const ring = [...seats].sort((a, b) => dir === "left" ? b - a : a - b);
      const i = ring.indexOf(sp);
      return [...ring.slice(i + 1), ...ring.slice(0, i), sp];
    }
    const start = (this.nightNo - 1) % seats.length;
    return [...seats.slice(start), ...seats.slice(0, start)];
  }

  async runDay() {
    const day = this.today;
    if (day.exploded != null) { this.phase = "night"; await this.io.pause("天黑"); return null; }
    this.phase = "day";
    const order = await this.speechOrder();
    this.say(`發言（從 ${order[0]}號 開始${this.sheriff != null ? "，警長最後" : ""}）`, "sub");
    for (const s of order) {
      const p = this.p(s);
      if (!p.alive) continue;
      if (await this.tryExplode(p)) {
        await this.badgeCheck();
        this.phase = "night";
        const w = this.checkWinner();
        if (!w) await this.io.pause("天黑");
        return w;
      }
      if (p.role === "KNIGHT") {
        const duel = await this.tryDuel(p);
        if (duel != null) {
          await this.badgeCheck();
          const w = this.checkWinner();
          if (w) return w;
          if (duel) { this.phase = "night"; await this.io.pause("天黑"); return null; }
          continue;  // 騎士出局，換下一位
        }
      }
      const sp = await this.ctrl[s].speak(this, p);
      sp.seat = s;
      this.registerSpeech(sp);
      this.say((s === this.sheriff ? "（警長）" : "") + renderSpeech(sp), "speech", s);
      this.io.update(this);
    }
    await this.io.pause("進入投票");
    this.say("投票", "sub");
    const exiled = await this.votePhase();
    this.phase = "night";
    if (exiled == null) { await this.io.pause("天黑"); return null; }
    const p = this.p(exiled);
    if (p.role === "IDIOT" && !p.revealed) {
      p.revealed = true; p.canVote = false;
      day.events.push(`${exiled}號 翻牌白痴`);
      this.say(`${exiled}號 翻牌【白痴】，免於出局，但從此不能投票。`, "event");
      this.io.update(this);
      await this.io.pause("天黑");
      return null;
    }
    day.exiled = exiled;
    this.say(`${exiled}號 被放逐出局。`, "event");
    await this.kill(exiled, "vote");
    this.io.update(this);
    let w = this.checkWinner();
    if (w) return w;
    await this.lastWords(exiled);
    await this.deathTrigger(exiled, "vote");
    await this.badgeCheck();
    w = this.checkWinner();
    if (!w) await this.io.pause("天黑");
    return w;
  }

  async collectVotes(candidates, voters, sheriff = false) {
    const votes = new Map();
    for (const v of voters) {
      const c = this.ctrl[v], me = this.p(v);
      const t = await (sheriff ? c.sheriffVote(this, me, [...candidates]) : c.vote(this, me, [...candidates]));
      votes.set(v, (candidates.includes(t) && t !== v) ? t : null);
    }
    return votes;
  }
  // 顯示票型並回傳最高票者；警長的票算 1.5 票
  showVotes(votes, weighted = true) {
    const w = v => weighted && v === this.sheriff ? 1.5 : 1;
    const by = new Map();
    for (const [v, t] of votes) if (t != null) { if (!by.has(t)) by.set(t, []); by.get(t).push(v); }
    const total = new Map([...by].map(([t, vs]) => [t, vs.reduce((a, v) => a + w(v), 0)]));
    const rows = [...by].sort((a, b) => total.get(b[0]) - total.get(a[0]));
    for (const [t, vs] of rows) this.say(`${t}號 ← ${vs.map(v => w(v) > 1 ? v + "(警長)" : v).join("、")}（${total.get(t)} 票）`, "vote");
    const abstain = [...votes].filter(([, t]) => t == null).map(([v]) => v);
    if (abstain.length) this.say(`棄票：${abstain.join("、")}`, "vote");
    if (!rows.length) return [];
    const top = total.get(rows[0][0]);
    return rows.filter(([t]) => total.get(t) === top).map(([t]) => t).sort(bySeat);
  }
  async votePhase() {
    const day = this.today;
    const cands = this.aliveSeats();
    const voters = cands.filter(s => this.p(s).canVote);
    day.votes = await this.collectVotes(cands, voters);
    let leaders = this.showVotes(day.votes);
    if (!leaders.length) { this.say("無人得票，今天沒有人出局。", "event"); return null; }
    if (leaders.length > 1) {
      this.say(`平票！${leaders.join("、")}號 上 PK 台，其他人重新投票。`, "event");
      const pkVoters = voters.filter(v => !leaders.includes(v));
      day.pkVotes = await this.collectVotes(leaders, pkVoters);
      leaders = this.showVotes(day.pkVotes);
      if (leaders.length !== 1) { this.say("再次平票，今天沒有人出局。", "event"); return null; }
    }
    return leaders[0];
  }

  async markDead(s, cause) {
    const p = this.p(s); p.alive = false; p.deathCause = cause;
    const wild = this.aliveWithRole("WILD_CHILD");
    if (wild && s === this.wildModel && !this.wildFixedGood && !wild.turned) await this.turnWild(wild);
  }
  // 白天出局：處理狼美人迷魅的連帶出局
  async kill(s, cause) {
    await this.markDead(s, cause);
    const c = this.charm;
    if (this.p(s).role === "WOLF_BEAUTY" && cause !== "duel" && c != null && this.p(c).alive) {  // 被騎士決鬥時技能被封
      this.say(`${c}號 被狼美人迷魅，一同出局。`, "event");
      await this.markDead(c, "charm");
      await this.deathTrigger(c, "charm");
    }
    this.io.update(this);
  }
  async turnWild(wild) {
    wild.turned = true;
    this.secret(`野孩子 ${wild.seat}號 轉入狼隊`);
    await this.ctrl[wild.seat].onTurn(this, wild);
  }
  // 騎士決鬥：true = 狼出局（立刻天黑）、false = 騎士出局、null = 沒有決鬥
  async tryDuel(knight) {
    if (this.knightUsed) return null;
    const t = await this.ctrl[knight.seat].knightDuel(this, knight);
    if (t == null || t === knight.seat || !this.p(t).alive) return null;
    this.knightUsed = true; knight.revealed = true;
    const target = this.p(t);
    this.today.events.push(`${knight.seat}號 騎士決鬥 ${t}號`);
    if (isWolf(target)) {
      target.revealed = true;
      this.say(`${knight.seat}號 翻牌【騎士】決鬥 ${t}號：${t}號 是狼人，出局！立刻天黑。`, "event");
      await this.kill(t, "duel");
      await this.deathTrigger(t, "duel");
      return true;
    }
    this.knightGold.add(t);
    this.say(`${knight.seat}號 翻牌【騎士】決鬥 ${t}號：${t}號 是好人，騎士以死謝罪。`, "event");
    await this.kill(knight.seat, "duel_fail");
    return false;
  }
  // 獵人開槍；狼王、覺醒狼王、被親傳的狼發動狼王爪
  async deathTrigger(s, cause) {
    const p = this.p(s);
    const hunter = p.role === "HUNTER";
    const shots = hunter ? 1 : (this.claws[s] || 0);
    if (shots <= 0) return;
    const c = this.ctrl[s];
    if (cause === "poison" || cause === "dream") { await c.hunterPoisoned(this, p); this.secret(`${s}號 因${CAUSE[cause]}，不能發動技能`); return; }
    for (let i = 0; i < shots; i++) {
      const t = await c.hunterShoot(this, p);
      if (t == null || t === s || !this.p(t).alive) { if (!p.revealed) this.secret(`${s}號 選擇不發動技能`); return; }
      if (!hunter) this.claws[s]--;
      p.revealed = true;
      const label = p.role === "WEREWOLF" ? "狼人（親傳狼王爪）" : R[p.role];
      const action = hunter ? "開槍" : "發動狼王爪";
      if (this.today) this.today.events.push(`${s}號 ${label}${action}帶走 ${t}號`);
      this.say(`${s}號 翻牌【${label}】，${action}帶走了 ${t}號！`, "event");
      const ct = hunter ? "shot" : "claw";
      await this.kill(t, ct);
      this.io.update(this);
      if (this.checkWinner() != null) return;
      await this.lastWords(t);
      await this.deathTrigger(t, ct);
      if (this.checkWinner() != null) return;
    }
  }
  async lastWords(s) {
    const sp = await this.ctrl[s].lastWords(this, this.p(s));
    sp.seat = s; sp.lastWords = true;
    this.registerSpeech(sp);
    this.say(renderSpeech(sp), "last", s);
    this.io.update(this);
  }
  registerSpeech(sp) {
    const s = sp.seat, n = this.players.length;
    const valid = t => Number.isInteger(t) && t >= 1 && t <= n;
    sp.checks = new Map([...sp.checks].filter(([t]) => valid(t) && t !== s));
    if (!valid(sp.accuse)) sp.accuse = null;
    if (sp.claim) {
      const prev = this.claims.get(s);
      const checks = prev && prev.role === sp.claim ? new Map(prev.checks) : new Map();
      this.claims.set(s, { role: sp.claim, checks });
    }
    if (sp.checks.size && ["SEER", "LANTERN"].includes(this.claimedRole(s))) for (const [t, w] of sp.checks) this.claims.get(s).checks.set(t, w);
    if (this.today) this.today.speeches.push(sp);
  }
}

// ================================================================ 電腦玩家
class Bot {
  constructor() { this.isHuman = false; this.checks = new Map(); this.fakeChecks = new Map(); this.fakeDays = new Set(); this.pref = {}; this.saved = null; this.item = null; this.traded = null; this.girlSeen = null; this.soft = {}; this.raw = new Map(); }
  setup(g, me) {
    for (const p of g.players) this.pref[p.seat] = Math.random();
    this.guessSeerAccurate = Math.random() < 0.5;  // 推不出來時，猜哪張預言家牌是準的
    if (isWolf(me) && !("fakeSeer" in g.wolfPlan)) {
      const bots = g.players.filter(p => isWolf(p) && !g.ctrl[p.seat].isHuman).map(p => p.seat);
      g.wolfPlan.fakeSeer = bots.length && Math.random() < 0.6 ? choice(bots) : null;
    }
  }
  analyze(g, me) {
    const claims = g.seerClaims();
    if (isWolf(me)) {
      const wolf = new Set(g.players.filter(isWolf).map(p => p.seat));
      return { good: new Set(g.players.map(p => p.seat).filter(s => !wolf.has(s))), wolf, trusted: null, claims };
    }
    const revealed = g.players.filter(p => p.revealed);
    const good = new Set([me.seat, ...revealed.filter(p => !isWolf(p)).map(p => p.seat), ...g.knightGold]);
    const wolf = new Set(revealed.filter(isWolf).map(p => p.seat));
    if (g.hasLantern) return this.lanternAnalyze(g, me, good, wolf, claims);
    for (const [t, w] of this.checks) (w ? wolf : good).add(t);  // 預言家或拿到查驗的幸運兒
    if (me.role === "SEER") for (const c of claims.keys()) if (c !== me.seat) wolf.add(c);
    let changed = true;
    while (changed) {
      changed = false;
      for (const [c, checks] of claims) {
        if (wolf.has(c) || good.has(c)) continue;
        for (const [t, w] of checks) {
          if ((w && good.has(t)) || (!w && wolf.has(t))) { wolf.add(c); changed = true; break; }
        }
      }
    }
    const cands = [...claims.keys()].filter(c => !wolf.has(c) && c !== me.seat);
    let trusted = null;
    if (me.role !== "SEER" && cands.length) trusted = cands.reduce((a, b) => this.pref[b] > this.pref[a] ? b : a);
    return { good, wolf, trusted, claims };
  }
  // 燈影預言家板：兩張預言家牌一正一反，用確定的事實反推哪張準
  lanternAnalyze(g, me, good, wolf, claims) {
    const cards = ["SEER", "LANTERN"];
    const mycard = cards.includes(me.role) ? me.role : null;
    for (const [t, w] of this.checks) (w ? wolf : good).add(t);
    if (mycard) for (const c of g.claimsOf(mycard).keys()) if (c !== me.seat) wolf.add(c);  // 跳我這張牌的是狼
    const holder = {}, reports = {};
    for (const card of cards) {
      if (card === mycard) { holder[card] = me.seat; reports[card] = new Map(this.raw); continue; }
      const cl = g.claimsOf(card);
      const cands = [...cl.keys()].filter(c => !wolf.has(c) && c !== me.seat);
      holder[card] = cands.length ? cands.reduce((a, b) => this.pref[b] > this.pref[a] ? b : a) : null;
      reports[card] = holder[card] != null ? cl.get(holder[card]) : new Map();
    }
    const acc = { SEER: null, LANTERN: null };
    for (const card of cards) for (const [t, shown] of reports[card]) {
      if (good.has(t)) acc[card] = !shown; else if (wolf.has(t)) acc[card] = shown;
    }
    if (acc.SEER == null && acc.LANTERN != null) acc.SEER = !acc.LANTERN;  // 一張準，另一張就是反的
    if (acc.LANTERN == null && acc.SEER != null) acc.LANTERN = !acc.SEER;
    if (mycard && acc[mycard] != null) for (const [t, shown] of this.raw) ((acc[mycard] ? shown : !shown) ? wolf : good).add(t);
    const evidence = new Map();
    for (const card of cards) {
      if (card === mycard && acc[card] != null) continue;
      let a = acc[card];
      const weight = a != null ? 20 : 8;
      if (a == null) a = card === "SEER" ? this.guessSeerAccurate : !this.guessSeerAccurate;
      for (const [t, shown] of reports[card]) {
        const truth = a ? shown : !shown;
        evidence.set(t, (evidence.get(t) || 0) + (truth ? weight : -weight / 2));
      }
    }
    const protectedSet = new Set(Object.values(holder).filter(h => h != null && h !== me.seat));
    const trusted = holder.SEER !== me.seat ? holder.SEER : null;
    return { good, wolf, trusted, claims, evidence, protected: protectedSet, cardAcc: acc };
  }
  suspicion(g, me, k) {
    const today = g.today, base = new Map();
    for (const p of g.players) {
      const s = p.seat;
      if (s === me.seat) continue;
      let v = this.pref[s] * 2;
      if (k.wolf.has(s)) v += 100;
      if (k.good.has(s)) v -= 100;
      if (k.evidence) {  // 燈影預言家板
        v += k.evidence.get(s) || 0;
        if (k.protected.has(s)) v -= 15; else if (["SEER", "LANTERN"].includes(g.claimedRole(s))) v += 10;
      } else if (k.trusted != null) {
        const checks = k.claims.get(k.trusted) || new Map();
        if (checks.has(s)) v += checks.get(s) ? 20 : -8;
        if (s === k.trusted) v -= 15; else if (k.claims.has(s)) v += 10;
      }
      if (["HUNTER", "WITCH", "IDIOT", "DREAMER", "MERCHANT", "KNIGHT", "VILLAGE_GIRL"].includes(g.claimedRole(s))) v -= 3;
      v += this.soft[s] || 0;
      for (const d of g.days) {
        for (const sp of d.speeches) if (sp.seat === s && sp.accuse != null) {
          if (k.good.has(sp.accuse) || sp.accuse === k.trusted) v += 5; else if (k.wolf.has(sp.accuse)) v -= 2;
        }
        if (d === today) continue;
        for (const votes of [d.votes, d.pkVotes]) {
          const t = votes.get(s);
          if (t == null) continue;
          if (k.good.has(t) || t === k.trusted) v += 5; else if (k.wolf.has(t)) v -= 3;
        }
      }
      base.set(s, v);
    }
    const score = new Map([...base].filter(([s]) => g.p(s).alive));
    if (today) for (const sp of today.speeches) {
      if (score.has(sp.accuse) && sp.seat !== me.seat && (base.has(sp.seat) ? base.get(sp.seat) : -99) < 8)
        score.set(sp.accuse, score.get(sp.accuse) + (sp.seat === k.trusted ? 3 : 1.5));
    }
    return score;
  }
  top(score, pool) {
    const p = (pool ?? [...score.keys()]).filter(s => score.has(s));
    return p.length ? p.reduce((a, b) => score.get(b) > score.get(a) ? b : a) : null;
  }
  chooseGuard(g, me) {
    const opts = g.aliveSeats().filter(s => s !== g.lastGuard);
    if (g.nightNo === 1) return Math.random() < 0.6 ? null : choice(opts);
    const k = this.analyze(g, me);
    if (k.trusted != null && opts.includes(k.trusted)) return k.trusted;
    const witch = opts.filter(s => g.claimedRole(s) === "WITCH");
    if (witch.length) return witch[0];
    return opts.length ? choice(opts) : null;
  }
  chooseKill(g, me) {
    const good = g.alive().filter(p => !isWolf(p)).map(p => p.seat);
    if (!good.length) return null;
    const hunters = new Set(good.filter(s => g.claimedRole(s) === "HUNTER"));
    const claims = g.seerClaims();
    const real = [...[...claims.keys()].filter(c => good.includes(c)), ...[...g.claimsOf("LANTERN").keys()].filter(c => good.includes(c))];
    const witches = good.filter(s => g.claimedRole(s) === "WITCH");
    const golds = real.flatMap(c => [...(g.claims.get(c)?.checks || new Map())].filter(([t, w]) => !w && good.includes(t)).map(([t]) => t));
    for (let grp of [real, witches, golds]) {
      grp = grp.filter(s => !hunters.has(s));
      if (grp.length && Math.random() < 0.85) return choice(grp);
    }
    const pool = good.filter(s => !hunters.has(s));
    return choice(pool.length ? pool : good);
  }
  witchAction(g, me, victim) {
    if (victim != null && g.canWitchSave(me, victim)) {
      const k = this.analyze(g, me);
      if ((g.nightNo === 1 && Math.random() < 0.9) || victim === k.trusted || k.good.has(victim)) { this.saved = victim; return ["save", null]; }
    }
    if (g.poison && g.nightNo >= 2) {
      const k = this.analyze(g, me);
      const certain = [...k.wolf].filter(s => g.p(s).alive);
      if (certain.length) return ["poison", choice(certain)];
      const score = this.suspicion(g, me, k), t = this.top(score);
      if (t != null && score.get(t) >= 20 && Math.random() < 0.5) return ["poison", t];
    }
    return [null, null];
  }
  chooseCheck(g, me) {
    const opts = g.checkOptions(me);  // 可能被虎姑婆誘導限制
    let pool = opts.filter(s => !this.checks.has(s) && !this.raw.has(s));
    if (!pool.length) pool = opts;
    if (!pool.length) return null;
    if (g.nightNo > 1 && Math.random() < 0.6) return this.top(this.suspicion(g, me, this.analyze(g, me)), pool);
    return choice(pool);
  }
  onCheckResult(g, me, t, w) {
    if (g.hasLantern && (me.role === "SEER" || me.role === "LANTERN")) this.raw.set(t, w);  // 不知道自己準不準
    else this.checks.set(t, w);
  }
  speak(g, me) { return this.speech(g, me, false); }
  lastWords(g, me) { return this.speech(g, me, true); }
  accusedToday(g, me) { return !!g.today && g.today.speeches.some(sp => sp.accuse === me.seat); }
  speech(g, me, last) {
    const k = this.analyze(g, me);
    if (isWolf(me)) return this.wolfSpeech(g, me, k, last);
    const score = this.suspicion(g, me, k), top = this.top(score);
    if (g.hasLantern && (me.role === "SEER" || me.role === "LANTERN") && this.raw.size) {
      const acc = k.cardAcc[me.role];
      const aliveWolves = [...k.wolf].filter(t => g.p(t).alive && t !== me.seat);
      const text = acc == null ? "我不知道自己是正確還是反向查驗，大家一起對資訊" : acc ? "我確定我是正確查驗" : "我是反向查驗，結果要反過來看";
      return mkSpeech(me.seat, { claim: me.role, checks: new Map(this.raw), accuse: [...aliveWolves, top][0], text });
    }
    if (me.role === "SEER") {
      const already = g.claimedRole(me.seat) === "SEER";
      if (this.checks.size && (last || already || [...this.checks.values()].some(Boolean) || k.claims.size || Math.random() < 0.8)) {
        const aliveWolves = [...this.checks].filter(([t, w]) => w && g.p(t).alive).map(([t]) => t);
        const rivals = [...k.claims.keys()].filter(c => c !== me.seat && g.p(c).alive);
        const accuse = [...aliveWolves, ...rivals, top][0];
        return mkSpeech(me.seat, { claim: "SEER", checks: new Map(this.checks), accuse, text: rivals.length ? "對跳的那位是悍跳狼！" : "" });
      }
    }
    if (last) {
      let text = k.trusted != null ? `請相信 ${k.trusted}號 預言家` : "大家加油";
      if (me.role === "WITCH" && this.saved) text += `；我救過 ${this.saved}號`;
      if (me.role === "MERCHANT" && this.traded) text += `；我把${ITEMS[this.traded[1]]}給了 ${this.traded[0]}號`;
      return mkSpeech(me.seat, { claim: me.role, accuse: top, text });
    }
    if (me.role === "VILLAGE_GIRL" && this.girlSeen) {
      const [t, shown, sure] = this.girlSeen;
      const wolfish = (k.wolf.has(t) || (!sure && (this.soft[t] || 0) > 0)) && g.p(t).alive;
      return mkSpeech(me.seat, { claim: "VILLAGE_GIRL", accuse: wolfish ? t : top, text: `我驗了 ${t}號，看到${shown ? "狼人" : "好人"}${sure ? "" : "（不確定準不準）"}` });
    }
    if (this.item === "check" && this.checks.size) {
      const [t, w] = [...this.checks][0];
      const aw = [...this.checks].filter(([x, y]) => y && g.p(x).alive).map(([x]) => x);
      return mkSpeech(me.seat, { accuse: [...aw, top][0], text: `我是幸運兒，用商人給的查驗驗了 ${t}號，他是${w ? "狼人" : "好人"}` });
    }
    if (["HUNTER", "WITCH", "MERCHANT", "DREAMER"].includes(me.role) && this.accusedToday(g, me)) {
      let text = { HUNTER: "出我的話我會開槍", DREAMER: "我是攝夢人，出我很虧" }[me.role] || "";
      if (me.role === "WITCH" && this.saved) text = `我救過 ${this.saved}號（銀水）`;
      if (me.role === "MERCHANT" && this.traded) text = `我把${ITEMS[this.traded[1]]}給了 ${this.traded[0]}號`;
      return mkSpeech(me.seat, { claim: me.role, accuse: top, text });
    }
    const text = k.trusted != null ? `我站 ${k.trusted}號 預言家的邊` : (k.claims.size >= 2 ? "預言家對跳，我還在聽" : "目前資訊不多");
    return mkSpeech(me.seat, { accuse: top, text });
  }
  wolfSpeech(g, me, k, last) {
    const goodAlive = g.alive().filter(p => !isWolf(p)).map(p => p.seat);
    if (g.wolfPlan.fakeSeer === me.seat) {
      if (!this.fakeDays.has(g.nightNo) && !(last && this.fakeChecks.size)) { this.fakeDays.add(g.nightNo); this.inventCheck(g, me, k, goodAlive); }
      const rivals = [...g.seerClaims().keys()].filter(c => c !== me.seat && g.p(c).alive);
      const fw = [...this.fakeChecks].filter(([t, w]) => w && g.p(t).alive).map(([t]) => t);
      const accuse = [...fw, ...rivals, ...goodAlive, null][0];
      return mkSpeech(me.seat, { claim: "SEER", checks: new Map(this.fakeChecks), accuse, text: rivals.length ? "我才是真預言家，對跳的是狼" : "" });
    }
    const target = this.wolfTarget(g);
    if (last) return mkSpeech(me.seat, { claim: "VILLAGER", accuse: target, text: "你們出錯人了" });
    if (this.accusedToday(g, me) && Math.random() < 0.25) return mkSpeech(me.seat, { claim: "HUNTER", accuse: target, text: "出我的話我會開槍" });
    const fake = g.wolfPlan.fakeSeer;
    return mkSpeech(me.seat, { accuse: target, text: fake != null && g.p(fake).alive ? `我站 ${fake}號 預言家` : "我是平民" });
  }
  inventCheck(g, me, k, goodAlive) {
    const unused = goodAlive.filter(s => !this.fakeChecks.has(s) && !g.p(s).revealed);
    const rivals = [...g.seerClaims().keys()].filter(c => unused.includes(c));
    const mates = g.aliveSeats().filter(s => k.wolf.has(s) && s !== me.seat && !this.fakeChecks.has(s));
    const roll = Math.random();
    if (rivals.length && roll < 0.8) this.fakeChecks.set(rivals[0], true);
    else if (mates.length && roll < 0.35) this.fakeChecks.set(choice(mates), false);
    else if (unused.length) this.fakeChecks.set(choice(unused), Math.random() < 0.6);
  }
  wolfTarget(g) {
    const good = g.alive().filter(p => !isWolf(p)).map(p => p.seat);
    if (!good.length) return null;
    const claims = g.seerClaims();
    const real = [...claims.keys()].filter(c => good.includes(c));
    if (real.length) return real[0];
    const fake = g.wolfPlan.fakeSeer;
    const fw = [...(claims.get(fake) || new Map())].filter(([t, w]) => w && good.includes(t)).map(([t]) => t);
    if (fw.length) return fw[0];
    if (g.today) {
      const acc = g.today.speeches.map(sp => sp.accuse).filter(a => good.includes(a));
      if (acc.length) return acc.reduce((a, b) => acc.filter(x => x === b).length > acc.filter(x => x === a).length ? b : a);
    }
    return good.reduce((a, b) => this.pref[b] > this.pref[a] ? b : a);
  }
  vote(g, me, cands) {
    const k = this.analyze(g, me);
    if (isWolf(me)) {
      const key = "vote" + g.nightNo;
      if (!cands.includes(g.wolfPlan[key])) g.wolfPlan[key] = this.wolfTarget(g);
      const t = g.wolfPlan[key];
      if (cands.includes(t)) return t;
      const good = cands.filter(c => !k.wolf.has(c));
      return good.length ? choice(good) : null;
    }
    return this.top(this.suspicion(g, me, k), cands.filter(c => c !== me.seat));
  }
  hunterShoot(g, me) {
    const k = this.analyze(g, me);
    if (isWolf(me)) {  // 狼王爪：帶走最有威脅的好人
      const good = g.alive().filter(p => !isWolf(p)).map(p => p.seat);
      const claims = g.seerClaims();
      const threats = [...[...claims.keys()].filter(c => good.includes(c)), ...good.filter(s => ["WITCH", "DREAMER", "MERCHANT"].includes(g.claimedRole(s)))];
      return threats.length ? threats[0] : (good.length ? choice(good) : null);
    }
    const certain = [...k.wolf].filter(s => g.p(s).alive);
    if (certain.length) return certain[0];
    const score = this.suspicion(g, me, k), t = this.top(score);
    if (t != null && score.get(t) >= 10) return t;
    return Math.random() < 0.4 ? t : null;
  }
  chooseDream(g, me) {
    const opts = g.aliveSeats().filter(s => s !== me.seat);
    if (!opts.length) return null;
    const k = this.analyze(g, me);
    if (k.wolf.has(g.lastDream) && opts.includes(g.lastDream)) return g.lastDream;  // 連夢處決確定的狼
    const certain = [...k.wolf].filter(s => opts.includes(s));
    if (certain.length && Math.random() < 0.5) return certain[0];
    let fresh = opts.filter(s => s !== g.lastDream);
    if (!fresh.length) fresh = opts;
    if (fresh.includes(k.trusted)) return k.trusted;
    return choice(fresh);
  }
  merchantTrade(g, me) {
    if (g.nightNo === 1 && Math.random() > 0.85) return null;
    const k = this.analyze(g, me);
    const opts = g.aliveSeats().filter(s => s !== me.seat);
    if (!opts.length) return null;
    const score = g.nightNo > 1 ? this.suspicion(g, me, k) : new Map();
    const val = s => score.has(s) ? score.get(s) : this.pref[s];
    const t = opts.reduce((a, b) => val(b) < val(a) ? b : a);
    const r = Math.random();
    const item = r < 0.7 ? "check" : r < 0.85 ? "poison" : "guard";
    this.traded = [t, item];
    return [t, item];
  }
  onLucky(g, me, item) { this.item = item; }
  luckyAction(g, me, item) {
    const k = this.analyze(g, me);
    const others = g.aliveSeats().filter(s => s !== me.seat);
    if (item === "check") {
      const pool = others.filter(s => !this.checks.has(s) && !k.good.has(s));
      if (!pool.length) return null;
      return g.nightNo > 1 ? this.top(this.suspicion(g, me, k), pool) : choice(pool);
    }
    if (item === "guard") return others.includes(k.trusted) ? k.trusted : choice(others);
    const certain = [...k.wolf].filter(s => others.includes(s));
    if (certain.length) return certain[0];
    const score = this.suspicion(g, me, k), t = this.top(score);
    return t != null && score.get(t) >= 20 ? t : null;
  }
  passClaw(g, me) {
    const mates = g.alive().filter(p => isWolf(p) && p.seat !== me.seat && !g.clawGiven.has(p.seat)).map(p => p.seat);
    if (!mates.length || Math.random() > 0.5) return null;
    return mates.includes(g.wolfPlan.fakeSeer) ? g.wolfPlan.fakeSeer : choice(mates);
  }
  onClaw() {}
  chooseModel(g, me) { return choice(g.aliveSeats().filter(s => s !== me.seat)); }
  onTurn() {}
  chooseCharm(g, me) {
    const good = g.alive().filter(p => !isWolf(p) && p.seat !== g.lastCharm).map(p => p.seat);
    if (!good.length) return null;
    const claims = g.seerClaims();
    const threats = [...[...claims.keys()].filter(c => good.includes(c)), ...good.filter(s => ["WITCH", "KNIGHT", "VILLAGE_GIRL"].includes(g.claimedRole(s)))];
    return threats.length && Math.random() < 0.7 ? threats[0] : choice(good);
  }
  chooseLure(g, me, centers) {
    if (Math.random() < 0.2) return null;
    const wolves = new Set(g.alive().filter(isWolf).map(p => p.seat));
    const cnt = c => [...g.ring(c)].filter(x => wolves.has(x)).length;
    const best = Math.min(...centers.map(cnt));
    return choice(centers.filter(c => cnt(c) === best));
  }
  girlCheck(g, me, opts) {
    const k = this.analyze(g, me);
    let pool = opts.filter(s => !k.good.has(s) && !k.wolf.has(s));
    if (!pool.length) pool = opts;
    return g.nightNo > 1 ? this.top(this.suspicion(g, me, k), pool) : choice(pool);
  }
  // 村姑只知道自己投給誰；投票對象身份確定時才能判斷結果準不準
  onGirlResult(g, me, t, shown) {
    const k = this.analyze(g, me);
    let basis = g.sheriffVotes.get(me.seat);
    const viaSheriff = basis != null;
    if (!viaSheriff) for (const d of [...g.days].reverse()) { basis = d.pkVotes.get(me.seat) ?? d.votes.get(me.seat); if (basis != null) break; }
    if (k.good.has(basis) || k.wolf.has(basis)) {
      const correct = k.wolf.has(basis) === viaSheriff;
      this.checks.set(t, correct ? shown : !shown);
      this.girlSeen = [t, shown, true];
    } else {
      const guess = viaSheriff ? !shown : shown;  // 投票對象多半是好人
      this.soft[t] = guess ? 12 : -6;
      this.girlSeen = [t, shown, false];
    }
  }
  knightDuel(g, me) {
    const k = this.analyze(g, me);
    const alive = g.aliveSeats().filter(s => s !== me.seat);
    const certain = [...k.wolf].filter(s => alive.includes(s));
    if (certain.length) return certain[0];
    if (g.nightNo >= 2 && k.evidence) {
      const strong = [...k.evidence].filter(([t, v]) => v >= 20 && alive.includes(t)).map(([t]) => t);
      if (strong.length && Math.random() < 0.5) return strong[0];
    } else if (g.nightNo >= 2 && k.trusted != null) {
      const checked = [...(k.claims.get(k.trusted) || new Map())].filter(([t, w]) => w && alive.includes(t)).map(([t]) => t);
      if (checked.length && Math.random() < 0.5) return checked[0];
    }
    return null;
  }
  runForSheriff(g, me) {
    if (me.role === "SEER" && this.checks.size) return Math.random() < 0.9;  // 真預言家上警
    if (isWolf(me) && g.wolfPlan.fakeSeer === me.seat) return true;      // 悍跳狼搶警徽
    return Math.random() < (isWolf(me) ? 0.35 : 0.3);
  }
  sheriffVote(g, me, cands) {
    const k = this.analyze(g, me);
    if (isWolf(me)) {
      const wolves = cands.filter(c => k.wolf.has(c));
      if (wolves.length) return wolves[0];
      const real = new Set(g.seerClaims().keys());
      const safe = cands.filter(c => !real.has(c));
      return safe.length ? choice(safe) : null;
    }
    if (cands.includes(k.trusted)) return k.trusted;
    const score = this.suspicion(g, me, k);
    const pool = cands.filter(c => c !== me.seat);
    const val = c => score.has(c) ? score.get(c) : this.pref[c];
    return pool.length ? pool.reduce((a, b) => val(b) < val(a) ? b : a) : null;
  }
  passBadge(g, me) {
    const alive = g.aliveSeats().filter(s => s !== me.seat);
    if (!alive.length) return null;
    const k = this.analyze(g, me);
    if (isWolf(me)) {
      const mates = alive.filter(s => k.wolf.has(s));
      return mates.length && Math.random() < 0.6 ? choice(mates) : null;
    }
    if (alive.includes(k.trusted)) return k.trusted;
    const good = alive.filter(s => k.good.has(s));
    if (good.length) return good[0];
    const score = this.suspicion(g, me, k);
    const val = s => score.get(s) ?? 0;
    const best = alive.reduce((a, b) => val(b) < val(a) ? b : a);
    return val(best) < 5 ? best : null;  // 沒把握就撕警徽
  }
  chooseDirection() { return Math.random() < 0.5 ? "left" : "right"; }
  selfExplode(g, me) {
    const wolvesAlive = g.alive().filter(isWolf).length;
    if (wolvesAlive < 2 || (g.nightNo > 1 && Math.random() < 0.5)) return false;
    const claims = g.seerClaims();
    const real = [...claims.keys()].filter(c => !isWolf(g.p(c)));
    if (g.phase === "election") {  // 真預言家已在警上報查驗 → 自爆打斷，不讓他拿警徽
      const spoke = new Set(g.today.speeches.map(sp => sp.seat));
      return real.some(c => spoke.has(c)) && Math.random() < 0.2;
    }
    const exposed = real.some(c => g.p(c).alive && claims.get(c).get(me.seat));  // 被真預言家查殺
    return exposed && Math.random() < 0.3;
  }
  hunterPoisoned() {}
}

// ================================================================ 真人玩家（按鈕）
class Human {
  constructor(ui) { this.isHuman = true; this.ui = ui; this.checks = new Map(); }
  setup(g, me) {
    let msg = `你是 ${me.seat}號【${R[me.role]}】。${DESC[me.role]}`;
    if (isWolf(me)) msg += ` 狼隊友：${g.players.filter(p => isWolf(p) && p.seat !== me.seat).map(p => p.seat + (p.role !== "WEREWOLF" ? `（${R[p.role]}）` : "")).join("、")}號。`;
    this.ui.say(msg, "private");
  }
  chooseGuard(g, me) {
    return this.ui.pickSeat({ title: "守衛：今晚要守護誰？", note: `上一晚守護：${g.lastGuard ?? "無"}（不能連守）`, seats: g.aliveSeats().filter(s => s !== g.lastGuard), none: "空守" });
  }
  chooseKill(g, me) {
    const mates = g.alive().filter(p => isWolf(p) && p.seat !== me.seat).map(p => p.seat);
    return this.ui.pickSeat({ title: "狼人：今晚要殺誰？", note: `存活的狼隊友：${mates.length ? mates.join("、") + "號" : "只剩你"}`, seats: g.aliveSeats(), none: "空刀", mark: mates });
  }
  async witchAction(g, me, victim) {
    const potions = `解藥：${g.antidote ? "有" : "已用"}　毒藥：${g.poison ? "有" : "已用"}`;
    if (g.antidote) {
      if (victim == null) this.ui.say("今晚狼人空刀，沒有人被殺。", "private");
      else if (g.canWitchSave(me, victim)) {
        const a = await this.ui.choose({ title: `女巫：今晚被殺的是 ${victim}號`, note: potions, options: [["save", "使用解藥救他"], ["no", "不救"]] });
        if (a === "save") return ["save", null];
      } else this.ui.say(`今晚被殺的是 ${victim}號（你自己），依規則不能自救。`, "private");
    } else this.ui.say("解藥已用，看不到今晚的刀口。", "private");
    if (g.poison) {
      const t = await this.ui.pickSeat({ title: "女巫：要使用毒藥嗎？", note: potions, seats: g.aliveSeats(), none: "不使用" });
      if (t != null) return ["poison", t];
    }
    return [null, null];
  }
  chooseCheck(g, me) {
    let note = this.checks.size ? "已查驗：" + [...this.checks].map(([t, w]) => `${t}號${w ? "狼" : "好"}`).join("、") : "第一次查驗";
    if (g.lureRange) note += `。虎姑婆的誘導生效：今晚只能查驗 ${[...g.lureRange].sort(bySeat).join("、")}號`;
    let seats = g.checkOptions(me).filter(s => !this.checks.has(s));
    if (!seats.length) seats = g.checkOptions(me);
    if (g.hasLantern) note += "。不能驗自己、翻牌騎士和騎金";
    return this.ui.pickSeat({ title: `${R[me.role]}：今晚要查驗誰？`, note, seats });
  }
  onCheckResult(g, me, t, w) {
    this.checks.set(t, w);
    const note = g.hasLantern && (me.role === "SEER" || me.role === "LANTERN") ? "（你不知道自己是正確還是反向查驗，結果可能是反的）" : "";
    this.ui.say(`查驗結果：${t}號 是${w ? "狼人" : "好人"}${note}`, "private");
  }
  speak(g, me) { return this.ui.compose(g, me, false); }
  lastWords(g, me) { return this.ui.compose(g, me, true); }
  vote(g, me, cands) {
    return this.ui.pickSeat({ title: cands.length < g.aliveSeats().length ? "PK 投票：要投誰？" : "投票：要放逐誰？", seats: cands.filter(c => c !== me.seat), none: "棄票" });
  }
  hunterShoot(g, me) {
    const others = g.aliveSeats().filter(s => s !== me.seat);
    if (me.role === "HUNTER") return this.ui.pickSeat({ title: "獵人：要開槍帶走誰？", seats: others, none: "不開槍" });
    return this.ui.pickSeat({ title: "狼王爪：要帶走誰？", note: `剩 ${g.claws[me.seat] || 0} 次`, seats: others, none: "不發動" });
  }
  hunterPoisoned(g, me) { this.ui.say(`你${me.deathCause === "poison" ? "被女巫毒死" : "夢遊出局"}，不能發動技能。`, "private"); }
  chooseDream(g, me) {
    return this.ui.pickSeat({ title: "攝夢人：今晚讓誰夢遊？", note: `上一晚的夢遊者：${g.lastDream ?? "無"}（連續兩晚選同一人會讓他出局）`, seats: g.aliveSeats().filter(s => s !== me.seat) });
  }
  async merchantTrade(g, me) {
    const t = await this.ui.pickSeat({ title: "奇蹟商人：要和誰交易？", note: "整局只能一次；交給狼人的話你會出局。", seats: g.aliveSeats().filter(s => s !== me.seat), none: "今晚不交易" });
    if (t == null) return null;
    const item = await this.ui.choose({ title: `要給 ${t}號 什麼？`, options: [["check", "查驗"], ["poison", "毒藥"], ["guard", "守護"]] });
    return [t, item];
  }
  onLucky(g, me, item) { this.item = item; this.ui.say(`你成為幸運兒！奇蹟商人給了你【${ITEMS[item]}】，可以使用一次，今晚就能用。`, "private"); }
  luckyAction(g, me, item) {
    const verb = { check: "查驗", poison: "毒", guard: "守護" }[item];
    return this.ui.pickSeat({ title: `幸運兒：今晚要${verb}誰？`, note: `你的道具：${ITEMS[item]}（一次性）`, seats: g.aliveSeats().filter(s => s !== me.seat), none: "先不用" });
  }
  passClaw(g, me) {
    const mates = g.alive().filter(p => isWolf(p) && p.seat !== me.seat && !g.clawGiven.has(p.seat)).map(p => p.seat);
    if (!mates.length) return null;
    return this.ui.pickSeat({ title: "覺醒狼王：要親傳狼王爪給誰？", note: `你還有 ${g.claws[me.seat]} 次狼王爪`, seats: mates, none: "不傳" });
  }
  onClaw() { this.ui.say("覺醒狼王把一次狼王爪親傳給你！出局時（被毒、夢遊除外）可以帶走一人。", "private"); }
  chooseModel(g, me) {
    return this.ui.pickSeat({ title: "野孩子：要選誰當榜樣？", note: "榜樣出局後你會轉入狼隊。", seats: g.aliveSeats().filter(s => s !== me.seat) });
  }
  onTurn(g, me) {
    const mates = g.alive().filter(p => isWolf(p) && p.seat !== me.seat).map(p => p.seat);
    this.ui.say(`你（野孩子）轉入狼隊了！狼隊友：${mates.join("、") || "無"}號。之後和狼人一起行動。`, "private");
  }
  chooseCharm(g, me) {
    return this.ui.pickSeat({ title: "狼美人：今晚要迷魅誰？", note: `上一晚迷魅：${g.lastCharm ?? "無"}（不能連續同一人）。你出局時被迷魅的人一同出局。`, seats: g.aliveSeats().filter(s => s !== me.seat && s !== g.lastCharm), none: "不迷魅" });
  }
  chooseLure(g, me, centers) {
    const last = g.lastLureRange.size ? `上次範圍：${[...g.lastLureRange].sort(bySeat).join("、")}號（新範圍不能重疊）。` : "";
    return this.ui.pickSeat({ title: "虎姑婆：要誘導哪個號碼？", note: `今晚預言家和村姑只能查驗這個號碼和左右兩人。${last}`, seats: centers, none: "今晚不用" });
  }
  girlCheck(g, me, opts) {
    let note = "整局一次。準不準看你的票：警長票投狼或放逐票投好人 → 正確；警長票投好人或放逐票投狼 → 相反。";
    if (g.lureRange) note += ` 虎姑婆的誘導生效：只能查驗 ${[...g.lureRange].sort(bySeat).join("、")}號。`;
    return this.ui.pickSeat({ title: "村姑：要查驗誰？", note, seats: opts, none: "先不用" });
  }
  onGirlResult(g, me, t, shown) { this.checks.set(t, shown); this.ui.say(`你看到 ${t}號 是${shown ? "狼人" : "好人"}（可能是反的，想想你投給了誰）`, "private"); }
  knightDuel(g, me) {
    return this.ui.pickSeat({ title: "騎士：要在發言前翻牌決鬥嗎？", note: "整局一次。對方是狼就出局並立刻天黑；是好人你就出局。", seats: g.aliveSeats().filter(s => s !== me.seat), none: "不決鬥，正常發言" });
  }
  async runForSheriff(g, me) {
    return (await this.ui.choose({ title: "警長競選：要上警嗎？", note: "警長投票算 1.5 票，決定發言方向並最後發言。上警的人不能投警長票。", options: [["yes", "上警"], ["no", "不上警"]] })) === "yes";
  }
  sheriffVote(g, me, cands) { return this.ui.pickSeat({ title: "警長投票：要投誰當警長？", seats: cands, none: "棄票" }); }
  passBadge(g, me) {
    return this.ui.pickSeat({ title: "你是警長，出局前要把警徽交給誰？", seats: g.aliveSeats().filter(s => s !== me.seat), none: "撕掉警徽" });
  }
  chooseDirection(g, me) {
    return this.ui.choose({ title: "你是警長：今天從哪邊開始發言？", note: "你會最後一個發言並歸票。", options: [["right", "警右（往大號）"], ["left", "警左（往小號）"]] });
  }
  async selfExplode(g, me) {
    const where = g.phase === "election" ? "警上發言" : "發言";
    return (await this.ui.choose({ title: `輪到你${where}`, note: "狼人可以自爆：立即出局、沒有遺言，今天直接天黑。", options: [["speak", "發言"], ["explode", "自爆"]] })) === "explode";
  }
}

// ================================================================ 畫面
const $ = id => document.getElementById(id);
const S = { mode: "play", preset: 0, role: "RANDOM", game: null, human: null, ui: null,
  custom: { WEREWOLF: 3, WOLF_KING: 1, SEER: 1, WITCH: 1, HUNTER: 1, DREAMER: 1, VILLAGER: 4 } };
const MAX_ONE = new Set(["WOLF_KING", "AWAKENED", "WOLF_BEAUTY", "TIGER", "WILD_CHILD", "VILLAGE_GIRL", "LANTERN", ...GODS]);
function currentRoles() {
  if (S.preset >= 0) return [...PRESETS[S.preset].roles];
  return ROLE_ORDER.flatMap(r => Array(S.custom[r] || 0).fill(r));
}
function customProblem(roles) {
  const wolves = roles.filter(r => WOLVES.has(r)).length;
  if (roles.length < 5 || roles.length > 18) return `目前 ${roles.length} 人，需要 5～18 人。`;
  if (!wolves || wolves === roles.length) return "至少要有 1 個狼人陣營和 1 個好人陣營。";
  return null;
}
try {
  const saved = JSON.parse(localStorage.getItem("ww-setup") || "{}");
  Object.assign(S, { mode: saved.mode || S.mode, preset: saved.preset ?? S.preset, custom: saved.custom || S.custom });
  if (S.preset >= PRESETS.length) S.preset = 0;
} catch {}

class UI {
  constructor(godView, humanSeat) {
    this.godView = godView; this.humanSeat = humanSeat; this.pending = null; this.auto = false; this.over = false;
    $("log").innerHTML = ""; $("action").innerHTML = "";
  }
  add(html, cls) {
    const li = document.createElement("li");
    li.className = cls; li.innerHTML = html;
    const log = $("log");
    log.appendChild(li);
    log.scrollTop = log.scrollHeight;
  }
  say(msg, kind = "sys", seat = null) {
    if (kind === "speech" || kind === "last") {
      const mine = seat === this.humanSeat ? " mine" : "";
      this.add(`<span class="who">${seat}號</span><span class="what">${esc(msg)}</span>`, `speech${kind === "last" ? " last" : ""}${mine}`);
    } else this.add(esc(msg), kind);
  }
  secret(msg) { if (this.godView) this.add(esc("上帝視角｜" + msg), "secret"); }
  phase(kind, title, sub) { this.add(`<span>${esc(title)}</span><small>${esc(sub)}</small>`, `phase ${kind}`); }

  update(g) {
    const h = this.humanSeat != null ? g.p(this.humanSeat) : null;
    const hc = h ? g.ctrl[h.seat] : null;
    const reveal = this.godView || this.over;
    $("seats").innerHTML = g.players.map(p => {
      const tags = [];
      if (p.seat === this.humanSeat) tags.push(`<span class="tag">你</span>`);
      if (p.seat === g.sheriff) tags.push(`<span class="tag claim">警長</span>`);
      if (reveal || p.revealed || p.seat === this.humanSeat) tags.push(`<span class="tag ${isWolf(p) ? "wolf" : "good"}">${R[p.role]}${p.turned ? "（轉狼）" : ""}</span>`);
      else if (h && isWolf(h) && isWolf(p)) tags.push(`<span class="tag wolf">${p.role === "WEREWOLF" ? "狼隊友" : R[p.role]}</span>`);
      else if (hc && hc.checks && hc.checks.has(p.seat)) tags.push(`<span class="tag ${hc.checks.get(p.seat) ? "wolf" : "good"}">驗${hc.checks.get(p.seat) ? "狼" : "好"}</span>`);
      const c = g.claimedRole(p.seat);
      if (c) tags.push(`<span class="tag claim">跳${R[c]}</span>`);
      if (!p.alive) tags.push(`<span class="tag">${reveal ? CAUSE[p.deathCause] : "出局"}</span>`);
      else if (!p.canVote) tags.push(`<span class="tag">無投票權</span>`);
      return `<div class="seat${p.alive ? "" : " dead"}${p.seat === this.humanSeat ? " you" : ""}"><span class="no">${p.seat}</span>${tags.join("")}</div>`;
    }).join("");
    if (h) {
      const info = [];
      if (isWolf(h)) info.push(`狼隊友：${g.players.filter(p => isWolf(p) && p.seat !== h.seat).map(p => p.seat + (p.alive ? "" : "（出局）")).join("、")}`);
      if (h.role === "WITCH") info.push(`解藥：${g.antidote ? "有" : "已用"}　毒藥：${g.poison ? "有" : "已用"}`);
      if (h.role === "SEER" && hc.checks.size) info.push("查驗：" + [...hc.checks].map(([t, w]) => `${t}號${w ? "狼" : "好"}`).join("、"));
      if (h.role === "GUARD") info.push(`上一晚守護：${g.lastGuard ?? "無"}`);
      if (h.role === "WILD_CHILD" && g.wildModel != null) info.push(`榜樣：${g.wildModel}號${h.turned ? "（已轉入狼隊）" : ""}`);
      if (h.role === "WOLF_BEAUTY" && g.charm != null) info.push(`目前迷魅：${g.charm}號`);
      if (h.role === "TIGER") info.push(`反傷：${g.reflectUsed ? "已觸發" : "未觸發"}`);
      if (h.role === "KNIGHT") info.push(g.knightUsed ? "已決鬥" : "決鬥還沒用");
      if (h.role === "VILLAGE_GIRL") info.push(g.girlUsed ? "查驗已用" : "查驗還沒用");
      if (h.role === "DREAMER") info.push(`上一晚夢遊者：${g.lastDream ?? "無"}`);
      if (h.role === "MERCHANT") info.push(g.tradeUsed ? "已交易" : "還沒交易");
      if (g.claws[h.seat]) info.push(`狼王爪：${g.claws[h.seat]} 次`);
      if (g.lucky && g.lucky.seat === h.seat) info.push(`幸運兒道具：${ITEMS[g.lucky.item]}${g.lucky.used ? "（已用）" : ""}`);
      if (h.role !== "SEER" && hc.checks.size) info.push("查驗：" + [...hc.checks].map(([t, w]) => `${t}號${w ? "狼" : "好"}`).join("、"));
      if (!h.alive) info.push("你已出局，接下來觀戰");
      $("me").innerHTML = `<span class="role ${isWolf(h) ? "wolfside" : "goodside"}">${h.seat}號・${R[h.role]}</span><span class="info">${esc(DESC[h.role])}</span>${info.length ? `<span class="info">${esc(info.join("｜"))}</span>` : ""}`;
    } else {
      $("me").innerHTML = `<span class="role">觀戰中</span><span class="info">${this.godView ? "上帝視角已開啟：虛線的紀錄是夜晚行動。" : "只看得到公開資訊，試著自己推理誰是狼。"}</span>`;
    }
  }

  wait(render) {
    return new Promise((resolve, reject) => {
      this.pending = reject;
      const el = $("action");
      el.innerHTML = "";
      render(el, v => { this.pending = null; el.innerHTML = ""; resolve(v); });
      el.querySelector("button")?.focus({ preventScroll: true });
      // 新的操作出現時捲到面板，紀錄框就在它正上方
      el.scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    });
  }
  cancel() { if (this.pending) { const r = this.pending; this.pending = null; r(new Abort()); } }

  head(el, title, note) {
    el.insertAdjacentHTML("beforeend", `<div class="title">${esc(title)}</div>${note ? `<div class="hint">${esc(note)}</div>` : ""}`);
  }
  quitButton() {
    const b = document.createElement("button");
    b.className = "secondary"; b.textContent = "結束本局";
    b.onclick = () => this.cancel();
    return b;
  }
  pickSeat({ title, note, seats, none, mark = [] }) {
    return this.wait((el, done) => {
      this.head(el, title, note);
      const grid = document.createElement("div");
      grid.className = "seatpick";
      for (const s of seats) {
        const b = document.createElement("button");
        b.innerHTML = `${s}${mark.includes(s) ? "<small>隊友</small>" : ""}`;
        b.onclick = () => done(s);
        grid.appendChild(b);
      }
      el.appendChild(grid);
      const bar = document.createElement("div");
      bar.className = "bar";
      if (none) { const n = document.createElement("button"); n.className = "secondary"; n.textContent = none; n.onclick = () => done(null); bar.appendChild(n); }
      else bar.appendChild(document.createElement("span"));
      bar.appendChild(this.quitButton());
      el.appendChild(bar);
    });
  }
  choose({ title, note, options }) {
    return this.wait((el, done) => {
      this.head(el, title, note);
      const bar = document.createElement("div");
      bar.className = "bar";
      const left = document.createElement("div");
      left.className = "chips";
      options.forEach(([v, label], i) => { const b = document.createElement("button"); b.className = i === 0 ? "primary" : "secondary"; b.textContent = label; b.onclick = () => done(v); left.appendChild(b); });
      bar.append(left, this.quitButton());
      el.appendChild(bar);
    });
  }
  pause(label) {
    if (this.humanSeat == null && this.auto) return new Promise(r => setTimeout(r, 900));
    return this.wait((el, done) => {
      const bar = document.createElement("div");
      bar.className = "bar";
      const go = document.createElement("button");
      go.className = "primary"; go.textContent = label;
      go.onclick = () => done();
      const left = document.createElement("div");
      left.className = "chips";
      left.appendChild(go);
      if (this.humanSeat == null) {
        const auto = document.createElement("button");
        auto.className = "secondary"; auto.textContent = "自動播放";
        auto.onclick = () => { this.auto = true; done(); };
        left.appendChild(auto);
      }
      bar.append(left, this.quitButton());
      el.appendChild(bar);
    });
  }
  compose(g, me, last) {
    return this.wait((el, done) => {
      this.head(el, last ? `${me.seat}號 的遺言` : `輪到你（${me.seat}號）發言`, "宣稱身份、報查驗、歸票都可以不填。");
      let claim = null, accuse = null;
      const checks = new Map();
      const box = document.createElement("div");
      box.style.cssText = "display:flex;flex-direction:column;gap:10px";
      el.appendChild(box);
      const draw = () => {
        const others = g.players.map(p => p.seat).filter(s => s !== me.seat);
        // 警長競選時昨晚死訊還沒公布，所有座位都能選，避免洩漏死訊
        const alive = (g.phase === "election" ? g.players.map(p => p.seat) : g.aliveSeats()).filter(s => s !== me.seat);
        box.innerHTML = `
          <div class="field"><span class="label">宣稱身份</span><div class="chips" id="cl"></div></div>
          ${claim === "SEER" ? `<div class="field"><span class="label">報查驗（點一下＝金水，再點＝查殺，再點＝取消）</span><div class="seatpick" id="ck"></div></div>` : ""}
          <div class="field"><span class="label">歸票</span><div class="seatpick" id="ac"></div></div>
          <input type="text" id="speech-text" maxlength="80" placeholder="補充一句話（可空白）">
          <div class="bar"><button class="primary" id="say">${last ? "說完遺言" : "發言"}</button></div>`;
        const cl = box.querySelector("#cl");
        const onBoard = new Set(g.players.map(p => p.role));  // 只列出這個板子裡有的角色
        [[null, "不宣稱"], ...ROLE_ORDER.filter(r => onBoard.has(r)).map(r => [r, R[r]])].forEach(([r, label]) => {
          const b = document.createElement("button");
          b.className = "chip"; b.textContent = label; b.setAttribute("aria-pressed", String(claim === r));
          b.onclick = () => { claim = r; if (r !== "SEER") checks.clear(); keep(); draw(); };
          cl.appendChild(b);
        });
        const ck = box.querySelector("#ck");
        if (ck) for (const s of others) {
          const b = document.createElement("button");
          const st = checks.has(s) ? (checks.get(s) ? "wolf" : "good") : "";
          b.className = st;
          b.innerHTML = `${s}${st ? `<small>${st === "wolf" ? "查殺" : "金水"}</small>` : ""}`;
          b.onclick = () => { if (!checks.has(s)) checks.set(s, false); else if (!checks.get(s)) checks.set(s, true); else checks.delete(s); keep(); draw(); };
          ck.appendChild(b);
        }
        const ac = box.querySelector("#ac");
        for (const s of alive) {
          const b = document.createElement("button");
          b.textContent = s; b.setAttribute("aria-pressed", String(accuse === s));
          b.onclick = () => { accuse = accuse === s ? null : s; keep(); draw(); };
          ac.appendChild(b);
        }
        const input = box.querySelector("#speech-text");
        input.value = draft;
        box.querySelector("#say").onclick = () => done(mkSpeech(me.seat, { claim, checks: new Map(checks), accuse, text: input.value.trim() }));
        const bar = box.querySelector(".bar");
        bar.appendChild(this.quitButton());
      };
      let draft = "";
      const keep = () => { const i = box.querySelector("#speech-text"); if (i) draft = i.value; };
      draw();
    });
  }
}

// ---------------------------------------------------------------- 設定畫面
function renderSetup() {
  $("boards").innerHTML = "";
  PRESETS.forEach((pr, i) => {
    const b = document.createElement("button");
    b.className = "board"; b.setAttribute("aria-pressed", String(S.preset === i));
    b.innerHTML = `<b>${pr.name}</b><span>${pr.desc}</span>`;
    b.onclick = () => { S.preset = i; S.role = "RANDOM"; renderSetup(); };
    $("boards").appendChild(b);
  });
  const cb = document.createElement("button");
  cb.className = "board"; cb.setAttribute("aria-pressed", String(S.preset === -1));
  cb.innerHTML = `<b>自訂板子</b><span>照真人局的配置，自己決定每個角色幾張</span>`;
  cb.onclick = () => { S.preset = -1; S.role = "RANDOM"; renderSetup(); };
  $("boards").appendChild(cb);
  $("custom-field").hidden = S.preset !== -1;
  if (S.preset === -1) {
    $("steppers").innerHTML = "";
    for (const r of ROLE_ORDER) {
      const n = S.custom[r] || 0, max = MAX_ONE.has(r) ? 1 : 8;
      const row = document.createElement("div");
      row.className = "stepper";
      row.innerHTML = `<span class="${WOLVES.has(r) ? "wolfname" : ""}">${R[r]}</span><button aria-label="減少${R[r]}" ${n <= 0 ? "disabled" : ""}>−</button><b>${n}</b><button aria-label="增加${R[r]}" ${n >= max ? "disabled" : ""}>＋</button>`;
      const [minus, plus] = row.querySelectorAll("button");
      minus.onclick = () => { S.custom[r] = Math.max(0, n - 1); renderSetup(); };
      plus.onclick = () => { S.custom[r] = Math.min(max, n + 1); renderSetup(); };
      $("steppers").appendChild(row);
    }
    const all = currentRoles(), w = all.filter(r => WOLVES.has(r)).length;
    $("custom-sum").textContent = customProblem(all) || `共 ${all.length} 人：狼人陣營 ${w}、好人陣營 ${all.length - w}。`;
  }
  const roles = [...new Set(currentRoles())];
  if (S.role !== "RANDOM" && !roles.includes(S.role)) S.role = "RANDOM";
  $("role-chips").innerHTML = "";
  [["RANDOM", "隨機"], ...roles.map(r => [r, R[r]])].forEach(([v, label]) => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = label; b.setAttribute("aria-pressed", String(S.role === v));
    b.onclick = () => { S.role = v; renderSetup(); };
    $("role-chips").appendChild(b);
  });
  for (const b of $("mode-chips").children) b.setAttribute("aria-pressed", String(b.dataset.mode === S.mode));
  $("role-field").hidden = S.mode !== "play";
  $("god-field").hidden = S.mode !== "watch";
  $("start").disabled = S.preset === -1 && !!customProblem(currentRoles());
  try { localStorage.setItem("ww-setup", JSON.stringify({ mode: S.mode, preset: S.preset, custom: S.custom })); } catch {}
}
for (const b of $("mode-chips").children) b.onclick = () => { S.mode = b.dataset.mode; renderSetup(); };

async function startGame() {
  const roles = shuffle(currentRoles());
  if (customProblem(roles)) return;
  const rules = { witchSelfSave: $("rule-self-save").value, sameGuardSaveDies: $("rule-sgs").value === "1", winMode: $("rule-win").value, sheriff: $("rule-sheriff").value === "1", selfExplode: $("rule-explode").value === "1", maxRounds: 30 };
  let humanSeat = null;
  const controllers = {};
  if (S.mode === "play") {
    humanSeat = 1 + Math.floor(Math.random() * roles.length);
    if (S.role !== "RANDOM") { const j = roles.indexOf(S.role); [roles[j], roles[humanSeat - 1]] = [roles[humanSeat - 1], roles[j]]; }
  }
  const ui = new UI(S.mode === "watch" && $("god-view").checked, humanSeat);
  if (humanSeat != null) controllers[humanSeat] = new Human(ui);
  const g = new Game(roles, controllers, rules, ui);
  Object.assign(S, { game: g, ui, human: humanSeat });
  $("setup").hidden = true; $("result").hidden = true; $("arena").hidden = false;
  const counts = {};
  for (const r of roles) counts[r] = (counts[r] || 0) + 1;
  ui.say(`本局 ${roles.length} 人：${Object.entries(counts).map(([r, n]) => `${R[r]}×${n}`).join("、")}`);
  let winner;
  try { winner = await g.play(); }
  catch (e) { if (e instanceof Abort) { backToSetup(); return; } throw e; }
  ui.over = true; ui.update(g);
  $("action").innerHTML = "";
  showResult(g, winner, humanSeat);
}
function backToSetup() { $("arena").hidden = true; $("result").hidden = true; $("setup").hidden = false; renderSetup(); }
$("start").onclick = startGame;

function showResult(g, winner, humanSeat) {
  const res = $("result");
  const kind = winner ?? "DRAW";
  let head = winner ? `${TEAM_NAME[winner]}獲勝` : "回合上限，平手";
  let sub = "";
  if (humanSeat != null && winner) sub = g.alignment(g.p(humanSeat)) === winner ? "你贏了！" : "你輸了，看看復盤找原因。";
  const mark = t => g.p(t).role === "WEREWOLF" ? `<span class="w">${t}狼</span>` : `<span class="g">${t}好</span>`;
  const voteRows = g.days.filter(d => d.votes.size).map(d => {
    const fmt = m => [...m].map(([v, t]) => `<span class="pair">${v}→${t == null ? "棄" : mark(t)}</span>`).join("");
    return `<div><b>第 ${d.day} 天</b>　${fmt(d.votes)}${d.pkVotes.size ? `<br><span class="hint">PK</span>　${fmt(d.pkVotes)}` : ""}</div>`;
  }).join("");
  const claims = [...g.seerClaims().keys()].map(c => `<li>${c}號 跳預言家 → ${g.p(c).role === "SEER" ? `<span class="g">真預言家</span>` : `<span class="w">假的（${R[g.p(c).role]}）</span>`}</li>`).join("");
  let mine = "";
  if (humanSeat != null) {
    const ts = g.days.flatMap(d => [d.votes.get(humanSeat), d.pkVotes.get(humanSeat)]).filter(t => t != null);
    if (ts.length) {
      const hit = ts.filter(t => isWolf(g.p(t))).length;
      const goodSide = g.alignment(g.p(humanSeat)) === "GOOD";
      const tip = !goodSide ? "你是狼：檢查一下發言和投票有沒有前後不一致、露出破綻。"
        : hit * 2 >= ts.length ? "投票準確度不錯。" : "你常投到好人。回頭看是被誰帶節奏、哪個查驗和事實矛盾。";
      mine = `<div class="field"><h3>你的投票</h3><p>共 ${ts.length} 票，投中狼 <b class="w">${hit}</b> 票、投到好人 <b class="g">${ts.length - hit}</b> 票。${tip}</p></div>`;
    }
  }
  res.innerHTML = `
    <div class="panel">
      <div class="banner ${kind}"><h2>${head}</h2>${sub ? `<p>${sub}</p>` : ""}</div>
      <h2>復盤</h2>
      <div class="field"><h3>身份</h3><div class="tablewrap"><table>
        <thead><tr><th>座位</th><th>身份</th><th>結果</th></tr></thead>
        <tbody>${g.players.map(p => `<tr><td>${p.seat}號${p.seat === humanSeat ? "（你）" : ""}</td><td class="${g.alignment(p) === "WOLF" ? "w" : "g"}">${R[p.role]}${p.role === "WILD_CHILD" ? (p.turned ? "（轉狼）" : `（${g.alignment(p) === "WOLF" ? "狼陣營" : "好人陣營"}）`) : ""}</td><td>${p.alive ? "存活" : CAUSE[p.deathCause]}</td></tr>`).join("")}</tbody>
      </table></div></div>
      ${g.hasLantern ? `<div class="field"><h3>燈影預言家</h3><p>本局查驗正確的是<b>${g.seerCardAccurate ? "預言家" : "燈影預言家"}</b>牌，另一張是反向查驗。</p></div>` : ""}
      <div class="field"><h3>夜晚行動</h3><ol class="godlog">${g.godLog.map(l => `<li>${l.round ? `第 ${l.round} 夜` : "開局"}：${esc(l.msg)}</li>`).join("")}</ol></div>
      ${voteRows ? `<div class="field"><h3>票型</h3><div class="votes">${voteRows}</div></div>` : ""}
      ${g.sheriffLog.length ? `<div class="field"><h3>警長</h3><ul class="godlog">${g.sheriffLog.map(l => `<li>${esc(l)}</li>`).join("")}</ul></div>` : ""}
      ${claims ? `<div class="field"><h3>預言家宣稱</h3><ul class="godlog">${claims}</ul></div>` : ""}
      ${mine}
      <div class="bar"><button class="primary" id="again">再來一局</button><button class="secondary" id="to-setup">換設定</button></div>
    </div>`;
  res.hidden = false;
  $("again").onclick = startGame;
  $("to-setup").onclick = backToSetup;
  res.scrollIntoView({ behavior: "smooth", block: "start" });
}
