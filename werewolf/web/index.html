const QUIZ = QUIZ_TOPICS.flatMap(t => t.qs);
const Q = { list: [], i: 0, score: 0, answered: false, picking: true };
function newQuiz(pool) { Q.list = shuffle([...pool]).slice(0, 10); Q.i = 0; Q.score = 0; Q.answered = false; Q.picking = false; renderQuiz(); }
function renderQuiz() {
  const el = $("quiz");
  if (Q.picking) {
    el.innerHTML = `<h2>規則測驗</h2><p class="hint">每次隨機 10 題，答完會顯示解說。選一個主題開始：</p><div class="opts" id="topics"></div>`;
    [{ name: "全部題目", qs: QUIZ }, ...QUIZ_TOPICS].forEach(t => {
      const b = document.createElement("button");
      b.className = "opt"; b.textContent = `${t.name}（${t.qs.length} 題）`;
      b.onclick = () => newQuiz(t.qs);
      $("topics").appendChild(b);
    });
    return;
  }
  if (Q.i >= Q.list.length) {
    el.innerHTML = `<div class="banner ${Q.score >= 8 ? "GOOD" : "DRAW"}"><h2>${Q.score} / ${Q.list.length}</h2><p>${Q.score >= 8 ? "規則很熟了，去對局練推理吧。" : "再做一次，或到「速查」複習。"}</p></div><div class="bar"><button class="primary" id="quiz-again">換一個主題</button></div>`;
    $("quiz-again").onclick = () => { Q.picking = true; renderQuiz(); };
    return;
  }
  const [q, opts, ans, why] = Q.list[Q.i];
  el.innerHTML = `<div class="progress"><i style="width:${Q.i / Q.list.length * 100}%"></i></div>
    <span class="label">第 ${Q.i + 1} 題，共 ${Q.list.length} 題｜答對 ${Q.score}</span>
    <p class="q">${q}</p><div class="opts" id="opts"></div><div id="why"></div>`;
  opts.forEach((o, j) => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = o;
    b.onclick = () => {
      if (Q.answered) return;
      Q.answered = true;
      if (j === ans) Q.score++;
      [...$("opts").children].forEach((c, k) => { if (k === ans) c.classList.add("right"); else if (k === j) c.classList.add("wrong"); });
      $("why").innerHTML = `<div class="explain">${j === ans ? "答對。" : "答錯。"}${why}</div>`;
      const next = document.createElement("button");
      next.className = "primary"; next.textContent = Q.i + 1 < Q.list.length ? "下一題" : "看成績";
      next.style.marginTop = "10px";
      next.onclick = () => { Q.i++; Q.answered = false; renderQuiz(); };
      $("why").appendChild(next);
    };
    $("opts").appendChild(b);
  });
}

    <dt>奇蹟商人</dt><dd>神職。整局一次，把查驗、毒藥或守護交給一人（幸運兒），當晚就能用一次。交給狼人則對方拿不到，商人天亮出局，所以商人活著代表幸運兒是好人。</dd>
  </dl>
  <p class="hint">這些角色各地細節可能不同，例如被狼王帶走的獵人能不能開槍。練習場的設定是可以，開局前記得問主持人。</p>
  <h2>村姑與虎姑婆（15 人）</h2>
  <p class="hint">狼美人、虎姑婆、2 小狼、野孩子｜預言家、女巫、騎士、守衛、村姑｜5 平民。夜晚順序：野孩子（首夜）→ 狼人（狼美人迷魅、虎姑婆誘導）→ 守衛 → 女巫 → 村姑 → 預言家。</p>
  <dl class="terms">
    <dt>狼美人</dt><dd>每晚可迷魅一人，不能連續兩晚同一人。狼美人出局時，被迷魅的人一同出局。不能自爆、不能被自刀；被騎士決鬥出局時技能被封。</dd>
    <dt>虎姑婆</dt><dd>【誘導】第二晚起每隔一晚：選一個號碼，預言家和村姑當晚只能驗它和左右兩人；新範圍不能和上次重疊（上次 3 → 2、3、4，下次最近只能 6 或 12）。野孩子入狼隊時整局只能用一次。【惡靈反傷】整局一次：被查驗或被毒時，使用技能的人出局，順序是村姑 > 預言家 > 女巫。</dd>
    <dt>野孩子</dt><dd>首夜選榜樣。榜樣是狼就屬於狼陣營（不知道狼是誰），是好人就是好人；榜樣出局後轉入狼隊。榜樣是村姑永遠是好人，是虎姑婆立刻知道狼隊。被驗永遠是金水；轉狼後好人不用放逐他也能贏。</dd>
    <dt>騎士</dt><dd>白天發言時可以翻牌決鬥一人（整局一次）：是狼就出局並立刻天黑；是好人騎士出局。</dd>
    <dt>村姑</dt><dd>整局一次查驗，投過票後的夜晚才能用。準不準看她的票，優先看警長票：警長票投狼 → 正確，投好人 → 相反；放逐票投狼 → 相反，投好人 → 正確。</dd>
    <dt>勝利條件</dt><dd>狼人：四神（預、女、騎、守）或五民全部出局，村姑和野孩子不算。好人：四狼（狼美人、虎姑婆、2 小狼）出局。</dd>
  </dl>
  <h2>燈影預言家（15 人）</h2>
  <p class="hint">狼王、狼美人、3 小狼｜預言家、女巫、騎士、守衛、獵人｜燈影預言家 + 4 平民。夜晚順序：守衛 → 狼人 → 狼美人 → 女巫 → 騎士 → 獵人 → 預言家 → 燈影預言家。</p>
  <dl class="terms">
    <dt>兩張預言家牌</dt><dd>開局主持人決定一張正確查驗、另一張反向查驗，兩人都不知道自己是哪種。預言家牌站神坑，燈影預言家牌站民坑。</dd>
    <dt>查驗限制</dt><dd>兩位預言家都不能驗自己、翻牌的騎士和騎金（騎士決鬥失敗證實的好人），不能用確定的好人校準。</dd>
    <dt>怎麼推</dt><dd>真的兩張牌驗同一個人，結果一定相反。用確定的事實反推哪張準：被查殺的人就是你自己、翻牌或自爆的狼、騎士決鬥的結果。確定一張，另一張就一定相反。</dd>
    <dt>狼美人、狼王</dt><dd>狼美人不能被自刀，被騎士決鬥時技能被封；狼王被毒時不能帶人。</dd>
    <dt>勝利條件</dt><dd>狼人：五神（預、女、騎、守、獵）或「四民 + 燈影預言家」全部出局。好人：五狼出局。</dd>
  </dl>
  <h2>勝利條件</h2>
  <ul><li>好人：所有狼人出局。</li><li>狼人（屠邊，最常見）：殺光所有平民，或殺光所有神職。</li><li>狼人（屠城）：殺光所有好人。</li></ul>
  <h2>開局前要問主持人</h2>
  <ol><li>女巫能不能自救？（全程不可／僅首夜可）</li><li>同守同救會不會死？</li><li>屠邊還是屠城？</li><li>有沒有警長？平票怎麼處理？警上自爆後警徽怎麼辦？</li><li>首夜以外的死者有沒有遺言？自爆有沒有遺言？</li></ol>
  <h2>術語</h2>
  <dl class="terms">
    <dt>金水</dt><dd>預言家查驗為好人的人</dd>
    <dt>查殺</dt><dd>預言家查驗為狼人的人</dd>
    <dt>銀水</dt><dd>女巫用解藥救的人</dd>
    <dt>刀口</dt><dd>狼人當晚殺的對象。空刀是不殺人，自刀是狼殺自己人來騙解藥</dd>
    <dt>跳</dt><dd>公開宣稱身份，例如「跳預言家」</dd>
    <dt>悍跳</dt><dd>狼人假冒預言家，通常會給真預言家發查殺</dd>
    <dt>對跳</dt><dd>兩人以上搶同一個身份</dd>
    <dt>站邊</dt><dd>選擇相信哪一位預言家</dd>
    <dt>歸票</dt><dd>發言最後說出要投誰</dd>
    <dt>警徽流</dt><dd>預言家事先公布之後要驗誰、警徽交給誰，讓資訊不中斷</dd>
    <dt>衝鋒狼</dt><dd>公開力挺悍跳隊友的狼</dd>
    <dt>倒鉤狼</dt><dd>假裝站真預言家的邊、甚至投隊友，騙取好人信任</dd>
    <dt>深水狼</dt><dd>發言低調、不表態的狼</dd>
    <dt>抗推</dt><dd>好人被當成狼推出去</dd>
    <dt>自爆</dt><dd>狼人白天直接翻牌出局，立刻進入黑夜，跳過投票</dd>
    <dt>PK</dt><dd>平票的人再發言一次，其他人重新投票</dd>
    <dt>票型</dt><dd>每個人投給誰。常常比發言更誠實</dd>
  </dl>
  <h2>真人局實戰建議</h2>
  <ul>
    <li>每輪記住三件事：誰跳了什麼、誰查殺誰、誰投給誰。</li>
    <li>找矛盾最可靠：有人說你是狼，但你是好人，他就一定在說謊。</li>
    <li>聽發言看三點：有沒有站邊、有沒有理由、有沒有歸票。含糊的人值得懷疑。</li>
    <li>平民不要亂跳神職；當狼時，發言和投票要一致。</li>
    <li>預言家提早想好警徽流；女巫首夜通常救人，毒藥有把握再用。</li>
    <li>獵人沒把握不要亂開槍；守衛盯著真預言家守。</li>
  </ul>`;
