<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#11131c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="推理筆記">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>狼人殺推理筆記</title>
<style>
:root {
  --bg: #11131c;
  --panel: #1a1d2a;
  --panel-2: #232738;
  --line: #2f3448;
  --text: #e9eaf2;
  --muted: #9095ad;
  --accent: #8b9cff;
  --good: #3fbf7f;
  --wolf: #ff5c6c;
  --wolf-bg: rgba(255, 92, 108, .16);
  --radius: 14px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  font-size: 16px;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  overscroll-behavior: none;
}
button {
  font: inherit;
  color: inherit;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 12px;
  min-height: 42px;
  cursor: pointer;
}
button:active { transform: scale(.97); }
button.on { background: var(--accent); color: #11131c; border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--wolf); }
.hint { color: var(--muted); font-size: 13px; }

/* ---------- layout ---------- */
.app {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.topbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.topbar h1 { font-size: 18px; margin: 0 auto 0 0; white-space: nowrap; }
.day-stepper { display: flex; align-items: center; gap: 6px; }
.day-stepper button { min-width: 42px; padding: 6px; }
.day-label { min-width: 68px; text-align: center; font-weight: 600; }
.toolbar { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.tool-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tool-row .label { font-size: 13px; color: var(--muted); margin-right: 2px; }
.pen-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-right: 4px; border: 2px solid #fff; }
.color-pick { display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 6px 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.color-pick.on { background: var(--accent); color: #11131c; border-color: var(--accent); font-weight: 600; }
.color-pick input { width: 26px; height: 26px; padding: 0; border: none; border-radius: 50%; background: none; cursor: pointer; }
.color-pick input::-webkit-color-swatch-wrapper { padding: 0; }
.color-pick input::-webkit-color-swatch { border: 2px solid #fff; border-radius: 50%; }
.canvas-wrap { flex: 1; position: relative; margin: 10px 12px 12px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); min-height: 0; }
#doodle { position: absolute; inset: 0; width: 100%; height: 100%; background: #fff; touch-action: none; cursor: crosshair; }
.stamp-layer { position: absolute; inset: 0; pointer-events: none; }

/* ---------- stamps ---------- */
.stamp {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 3px 10px; border-radius: 999px; border: 2px solid transparent;
  font-size: 15px; font-weight: 700; line-height: 1.3; white-space: nowrap;
  touch-action: none; cursor: grab; box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
}
.stamp-layer .stamp { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; }
.palette .stamp { min-height: 36px; }
.stamp.dragging { position: fixed; transform: translate(-50%, -50%) scale(1.1); z-index: 40; pointer-events: none; opacity: .9; }
.stamp.leaving { opacity: .35; }
.s-up { background: #4c6ef5; color: #fff; }
.s-gold { background: #f2b400; color: #2b2100; }
.s-silver { background: #c9d1e3; color: #1d2333; border-color: #8e97ad; }
.s-wolf { background: #e03131; color: #fff; }
.s-sus { background: #f76707; color: #fff; }
.s-good { background: #2f9e44; color: #fff; }
.s-kill { background: #fff; color: #e03131; border-color: #e03131; }

/* ---------- sheet ---------- */
.overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); display: none; z-index: 20; }
.overlay.open { display: flex; align-items: center; justify-content: center; }
.sheet {
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
  width: min(640px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow-y: auto; padding: 18px;
}
.sheet h3 { margin-top: 0; }
.sheet-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.opt-group { display: flex; flex-wrap: wrap; gap: 6px; }
.field-label { color: var(--muted); font-size: 13px; margin: 14px 0 6px; }
.card { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.card h3 { margin: 0 0 10px; font-size: 15px; }
.badge { font-size: 13px; padding: 4px 8px; border-radius: 6px; background: var(--panel-2); white-space: nowrap; }
.rules h4 { margin: 14px 0 6px; font-size: 15px; }
.rules h4.wolf-side { color: var(--wolf); }
.rules h4.good-side { color: var(--good); }
.rules dl { margin: 0; }
.rules dt { font-weight: 600; margin-top: 10px; }
.rules dd { margin: 3px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; white-space: pre-line; }
.rules .order { font-size: 15px; line-height: 1.7; }

/* ---------- privacy cover ---------- */
.cover {
  position: fixed; inset: 0; z-index: 50; background: #05060a;
  display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
  color: #3a3f55; font-size: 15px;
}
.cover.open { display: flex; }
.cover .moon { font-size: 64px; opacity: .5; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>🐺 推理筆記 <span class="hint" id="boardLabel"></span></h1>
    <div class="day-stepper">
      <button id="dayDown" aria-label="前一天">−</button>
      <div class="day-label" id="dayLabel">第 1 天</div>
      <button id="dayUp" aria-label="下一天">＋</button>
    </div>
    <button id="rulesBtn">📖 板子</button>
    <button id="hideBtn" title="遮住螢幕，避免被偷看">🙈 遮住</button>
    <button id="newGameBtn">新的一局</button>
  </header>

  <div class="toolbar">
    <div class="tool-row" id="toolRow">
      <button data-pen="#111111" class="on"><span class="pen-dot" style="background:#111111"></span>黑</button>
      <button data-pen="#1e5bd8"><span class="pen-dot" style="background:#1e5bd8"></span>藍</button>
      <button data-pen="#d92b2b"><span class="pen-dot" style="background:#d92b2b"></span>紅</button>
      <label class="color-pick" id="colorPick"><input type="color" id="penColor" value="#2e9e5b" aria-label="自訂顏色">自訂</label>
      <button data-pen="eraser">🧽 橡皮擦</button>
      <button data-act="undo">↶ 復原</button>
      <button data-act="clear" class="danger">清空</button>
    </div>
    <div class="tool-row palette" id="palette">
      <span class="label">圖章（用 Apple Pencil 拖到畫布）</span>
    </div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="doodle"></canvas>
    <div class="stamp-layer" id="stampLayer"></div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="cover" id="cover"><div class="moon">🌙</div><div>點兩下解除</div></div>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // The rules shown under 📖 板子.
  const BOARDS = {
    std12: {
      name: '12人 標準局（預女獵白）',
      seats: 12,
      roles: ['預言家', '女巫', '獵人', '白痴', '守衛', '平民', '狼人', '白狼王', '狼王'],
      causes: ['被刀', '被毒', '被投出', '被槍殺', '自爆', '其他'],
      checkers: ['預言家'],
      wolfCount: '4 狼',
      wolfSlots: 4,
      setup: { wolf: ['狼人 ×4'], good: ['預言家', '女巫', '獵人', '白痴', '平民 ×4'] },
      roleInfo: null,
      night: null,
      win: { wolf: '神職全部出局，或平民全部出局。', good: '狼人全部出局。' },
    },
    hu15: {
      name: '15人 村姑與虎姑婆',
      seats: 15,
      roles: ['預言家', '女巫', '騎士', '守衛', '村姑', '平民', '狼美人', '虎姑婆', '小狼', '野孩子'],
      causes: ['被刀', '被毒', '被投出', '被騎士決鬥', '被狼美人帶走', '被反傷', '自爆', '其他'],
      checkers: ['預言家', '村姑'],
      knight: true,
      wolfCount: '4 狼 + 野孩子',
      wolfSlots: 5,
      setup: {
        wolf: ['狼美人', '虎姑婆', '小狼 ×2', '野孩子'],
        good: ['預言家', '女巫', '騎士', '守衛', '村姑', '平民 ×5'],
      },
      roleInfo: {
        wolf: [
          ['狼美人【迷魅】', '每晚可迷魅一個玩家，不可連續（ABA）。\n狼美人出局時，被迷魅的玩家一同出局。'],
          ['虎姑婆【誘導】', '第二晚開始，選擇一個號碼，預言家與村姑的查驗只能用在此號碼及左右兩個號碼的玩家身上（例：選 3 → 只能驗 2、3、4）。\n每隔一晚才能使用一次，相同號碼不可重複。'],
          ['虎姑婆【被動・惡靈反傷】', '當虎姑婆被查驗或被女巫毒，技能使用者被反傷出局。\n只生效一次，生效順序：村姑驗 > 預言家驗 > 女巫毒。'],
          ['小狼 ×2', '一般狼人。'],
          ['野孩子（被驗是金水）', '首夜選一位榜樣學習：榜樣是狼 → 屬狼陣營（不知道狼隊、不見面）；榜樣是好人 → 屬好人陣營（不知道）。\n榜樣出局後，野孩子轉入狼陣營。野孩子入狼隊後，虎姑婆【誘導】只能再用一次。\n彩蛋：榜樣是村姑 → 永遠是好人陣營；榜樣是虎姑婆 → 知道所有狼隊位置。'],
        ],
        good: [
          ['預言家', '每晚查驗一人身分。'],
          ['女巫', '一瓶毒藥、一瓶解藥。'],
          ['騎士', '守護他人，也守護正義。'],
          ['守衛', '黑夜中的盾，守護村莊。'],
          ['村姑【認錯人】', '投票後獲得查驗一人的機會，夜晚使用（全場一次，結果優先以警上票為主）：\n・警徽投狼人 → 正確查驗\n・警徽投好人 → 相反查驗\n・出局投狼人 → 相反查驗\n・出局投好人 → 正確查驗'],
          ['平民 ×5', '平凡卻重要，團結找出真相。'],
        ],
      },
      night: {
        first: '野孩子 → 4狼（狼美人迷魅） → 守衛 → 女巫 → 村姑 → 預言家',
        next: '4狼（狼美人迷魅、虎姑婆誘導） → 守衛 → 女巫 → 村姑（查驗） → 預言家（查驗）',
      },
      win: { wolf: '四神（預、女、騎、守）全部出局，或五平民＋村姑全部出局。', good: '四狼出局（野孩子若已入狼隊，不需要出局）。' },
    },
    lamp15: {
      name: '15人 燈影預言家',
      seats: 15,
      roles: ['預言家', '燈影預言家', '女巫', '騎士', '守衛', '獵人', '平民', '狼王', '狼美人', '小狼'],
      causes: ['被刀', '被毒', '被投出', '被騎士決鬥', '被狼美人帶走', '被獵人帶走', '被狼王帶走', '自爆', '其他'],
      checkers: ['預言家', '燈影預言家'],
      knight: true,
      lantern: true,
      wolfCount: '5 狼',
      wolfSlots: 5,
      setup: {
        wolf: ['狼王', '狼美人', '小狼 ×3'],
        good: ['預言家', '女巫', '騎士', '守衛', '獵人', '燈影預言家', '平民 ×4'],
      },
      roleInfo: {
        wolf: [
          ['狼王【狼爪】', '出局時可發動技能，帶走一名玩家。\n被女巫毒死則技能被封。'],
          ['狼美人【迷魅】', '每晚可迷魅一個玩家，不可連續（ABA）。狼美人出局時，被迷魅的玩家一同出局。\n不可自刀。被騎士決鬥出局時技能被封（被迷魅的人不會出局）。'],
          ['小狼 ×3', '一般狼人。'],
        ],
        good: [
          ['預言家（站神坑）', '每晚查驗一人。開局前上帝決定「預言家牌」和「燈影預言家牌」哪一張是正確查驗，另一張就是反向查驗。拿到牌的人不知道自己是哪一種。'],
          ['燈影預言家（站民坑）', '每晚查驗一人，查驗可能正確也可能反向（和預言家牌相反）。屠民時算在民那一邊。'],
          ['查驗限制', '兩位預言家都不能驗自己、翻牌的騎士和騎金（騎士決鬥失敗而證實的好人），以免直接確認自己是不是反向。'],
          ['女巫', '一瓶毒藥、一瓶解藥。'],
          ['騎士', '白天可翻牌決鬥一人：對方是狼則狼出局；是好人則騎士出局，對方成為「騎金」。'],
          ['守衛', '每晚守護一人，使他不被狼刀。'],
          ['獵人', '出局時可開槍帶走一人（被毒死則不能）。'],
          ['平民 ×4', '沒有技能，靠推理投票。'],
        ],
      },
      night: { all: '守衛 → 狼人 → 狼美人（迷魅） → 女巫 → 騎士 → 獵人 → 預言家 → 燈影預言家' },
      win: { wolf: '五神（預、女、騎、守、獵）全部出局，或「四民＋燈影預言家」全部出局。', good: '五狼全部出局。' },
    },
  };

  const STAMPS = {
    up: { label: '上警', cls: 's-up' },
    gold: { label: '金水', cls: 's-gold' },
    silver: { label: '銀水', cls: 's-silver' },
    wolf: { label: '🐺 狼', cls: 's-wolf' },
    sus: { label: '❓ 懷疑', cls: 's-sus' },
    good: { label: '好人', cls: 's-good' },
    kill: { label: '查殺', cls: 's-kill' },
  };

  // ---------- state ----------
  // Game: which board's rules to show and which day it is.
  // Pages: one drawing per day — strokes (tool, points in CSS px) plus stamps (kind, x, y).
  const GAME_KEY = 'werewolf-draw-game-v1';
  const PAGES_KEY = 'werewolf-draw-pages-v1';
  const load = (key, fallback) => {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  };
  const store = (key, value) => {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ }
  };

  let game = load(GAME_KEY, null);
  let pages = load(PAGES_KEY, null);
  if (!game || !BOARDS[game.board]) {
    // Carry over the board and day from the earlier notebook, if any.
    const old = load('werewolf-notes-v1', {}) || {};
    game = { board: BOARDS[old.board] ? old.board : 'std12', day: old.day > 0 ? old.day : 1 };
  }
  if (!pages || typeof pages !== 'object') {
    // Earlier doodles (one stroke list per day) become this version's pages.
    pages = {};
    const oldDoodle = load('werewolf-doodle-v2', null);
    if (oldDoodle && typeof oldDoodle === 'object') {
      Object.entries(oldDoodle).forEach(([d, strokes]) => {
        if (Array.isArray(strokes) && strokes.length) pages[d] = { strokes, stamps: [] };
      });
    }
  }
  const page = () => (pages[game.day] = pages[game.day] || { strokes: [], stamps: [] });
  const saveGame = () => store(GAME_KEY, game);
  const savePages = () => store(PAGES_KEY, pages);

  // Undo history per day (in memory): snapshots of the page before each change.
  const history = {};
  function remember() {
    const h = (history[game.day] = history[game.day] || []);
    h.push(JSON.stringify(page()));
    if (h.length > 60) h.shift();
  }
  function undo() {
    const h = history[game.day];
    if (!h || !h.length) return;
    pages[game.day] = JSON.parse(h.pop());
    savePages();
    renderPage();
  }

  // ---------- canvas ----------
  const PEN_WIDTH = 3;
  const ERASER_WIDTH = 26;
  const canvas = $('doodle');
  const ctx = canvas.getContext('2d');
  let tool = '#111111';
  let current = null;
  let pointerId = null;

  function strokeStyle(st) {
    const eraser = st.tool === 'eraser';
    ctx.globalCompositeOperation = eraser ? 'destination-out' : 'source-over';
    ctx.strokeStyle = eraser ? '#000' : st.tool;
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineWidth = eraser ? ERASER_WIDTH : PEN_WIDTH;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }
  function drawStroke(st) {
    const pts = st.points;
    if (!pts.length) return;
    strokeStyle(st);
    ctx.beginPath();
    if (pts.length === 1) {
      ctx.arc(pts[0][0], pts[0][1], ctx.lineWidth / 2, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  }
  function redrawCanvas() {
    const dpr = window.devicePixelRatio || 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    page().strokes.forEach(drawStroke);
  }
  function sizeCanvas() {
    const r = $('canvasWrap').getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.round(r.width * dpr));
    const h = Math.max(1, Math.round(r.height * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      redrawCanvas();
    }
  }
  const pointAt = (e) => {
    const r = canvas.getBoundingClientRect();
    return [Math.round((e.clientX - r.left) * 10) / 10, Math.round((e.clientY - r.top) * 10) / 10];
  };

  // Only the Apple Pencil (or a mouse) draws and moves stamps; finger and palm touches are ignored.
  const isFinger = (e) => e.pointerType === 'touch';

  canvas.addEventListener('pointerdown', (e) => {
    if (isFinger(e) || pointerId !== null) return;
    e.preventDefault();
    remember();
    pointerId = e.pointerId;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* keep drawing without capture */ }
    current = { tool, points: [pointAt(e)] };
    page().strokes.push(current);
    drawStroke(current);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pointerId || !current) return;
    e.preventDefault();
    const pts = current.points;
    const events = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
    strokeStyle(current);
    events.forEach((ev) => {
      const prev = pts[pts.length - 1];
      const p = pointAt(ev);
      if (p[0] === prev[0] && p[1] === prev[1]) return;
      pts.push(p);
      ctx.beginPath();
      ctx.moveTo(prev[0], prev[1]);
      ctx.lineTo(p[0], p[1]);
      ctx.stroke();
    });
  });
  const endStroke = (e) => {
    if (e.pointerId !== pointerId) return;
    pointerId = null;
    current = null;
    savePages();
  };
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);

  // ---------- stamps ----------
  const stampEl = (kind) => {
    const el = document.createElement('div');
    el.className = `stamp ${STAMPS[kind].cls}`;
    el.textContent = STAMPS[kind].label;
    el.dataset.kind = kind;
    return el;
  };
  function renderStamps() {
    const layer = $('stampLayer');
    layer.innerHTML = '';
    page().stamps.forEach((s, i) => {
      const el = stampEl(s.kind);
      el.style.left = `${s.x}px`;
      el.style.top = `${s.y}px`;
      el.dataset.index = i;
      layer.appendChild(el);
    });
  }
  function renderPage() {
    redrawCanvas();
    renderStamps();
  }
  const inCanvas = (x, y) => {
    const r = $('canvasWrap').getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  };
  const toCanvas = (x, y) => {
    const r = $('canvasWrap').getBoundingClientRect();
    return { x: Math.round(x - r.left), y: Math.round(y - r.top) };
  };

  // Drag a stamp from the palette onto the page.
  const palette = $('palette');
  Object.keys(STAMPS).forEach((kind) => {
    const el = stampEl(kind);
    el.title = `把「${STAMPS[kind].label}」拖到畫布`;
    palette.appendChild(el);
  });
  let drag = null;
  palette.addEventListener('pointerdown', (e) => {
    const src = e.target.closest('.stamp');
    if (!src || isFinger(e) || drag) return;
    e.preventDefault();
    const ghost = stampEl(src.dataset.kind);
    ghost.classList.add('dragging');
    ghost.style.left = `${e.clientX}px`;
    ghost.style.top = `${e.clientY}px`;
    document.body.appendChild(ghost);
    drag = { from: 'palette', kind: src.dataset.kind, ghost, pointerId: e.pointerId };
    try { src.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });

  // Move a stamp already on the page; drop it outside the page (or tap it with the eraser) to remove it.
  $('stampLayer').addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.stamp');
    if (!el || isFinger(e) || drag) return;
    e.preventDefault();
    const i = Number(el.dataset.index);
    if (tool === 'eraser') {
      remember();
      page().stamps.splice(i, 1);
      savePages();
      renderStamps();
      return;
    }
    drag = { from: 'page', index: i, el, pointerId: e.pointerId };
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });

  document.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.pointerId) return;
    e.preventDefault();
    if (drag.from === 'palette') {
      drag.ghost.style.left = `${e.clientX}px`;
      drag.ghost.style.top = `${e.clientY}px`;
    } else {
      const p = toCanvas(e.clientX, e.clientY);
      drag.el.style.left = `${p.x}px`;
      drag.el.style.top = `${p.y}px`;
      drag.el.classList.toggle('leaving', !inCanvas(e.clientX, e.clientY));
      drag.moved = true;
    }
  });
  const endDrag = (e) => {
    if (!drag || e.pointerId !== drag.pointerId) return;
    const inside = e.type === 'pointerup' && inCanvas(e.clientX, e.clientY);
    const p = toCanvas(e.clientX, e.clientY);
    if (drag.from === 'palette') {
      drag.ghost.remove();
      if (inside) {
        remember();
        page().stamps.push({ kind: drag.kind, x: p.x, y: p.y });
      }
    } else if (drag.moved) {
      remember();
      if (inside) Object.assign(page().stamps[drag.index], p);
      else page().stamps.splice(drag.index, 1);
    }
    drag = null;
    savePages();
    renderStamps();
  };
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);

  // ---------- tools ----------
  function selectTool(t, el) {
    tool = t;
    document.querySelectorAll('#toolRow [data-pen], #colorPick').forEach((x) => x.classList.toggle('on', x === el));
  }
  $('penColor').addEventListener('input', (e) => selectTool(e.target.value, $('colorPick')));
  $('penColor').addEventListener('click', (e) => selectTool(e.target.value, $('colorPick')));
  $('toolRow').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.pen) { selectTool(b.dataset.pen, b); return; }
    if (b.dataset.act === 'undo') undo();
    if (b.dataset.act === 'clear') {
      const pg = page();
      if (!pg.strokes.length && !pg.stamps.length) return;
      if (!confirm(`清空第 ${game.day} 天這一頁（筆跡和圖章）？`)) return;
      remember();
      pages[game.day] = { strokes: [], stamps: [] };
      savePages();
      renderPage();
    }
  });

  // ---------- days ----------
  function renderHeader() {
    $('dayLabel').textContent = `第 ${game.day} 天`;
    $('boardLabel').textContent = BOARDS[game.board].name;
  }
  function changeDay(delta) {
    if (game.day + delta < 1) return;
    game.day += delta;
    current = null;
    pointerId = null;
    saveGame();
    renderHeader();
    renderPage();
  }
  $('dayUp').addEventListener('click', () => changeDay(1));
  $('dayDown').addEventListener('click', () => changeDay(-1));

  // ---------- sheets: rules and new game ----------
  const openSheet = (html) => { $('sheet').innerHTML = html; $('overlay').classList.add('open'); };
  const closeSheet = () => $('overlay').classList.remove('open');
  $('overlay').addEventListener('click', (e) => { if (e.target === $('overlay')) closeSheet(); });

  function rulesHTML() {
    const b = BOARDS[game.board];
    const list = (items) => items.map((x) => `<span class="badge">${esc(x)}</span>`).join(' ');
    const info = (items) => `<dl>${items.map(([t, d]) => `<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join('')}</dl>`;
    return `
      <div class="card rules">
        <h3>${esc(b.name)}</h3>
        <h4 class="wolf-side">狼人陣營</h4><div class="opt-group">${list(b.setup.wolf)}</div>
        <h4 class="good-side">好人陣營</h4><div class="opt-group">${list(b.setup.good)}</div>
        <div class="hint" style="margin-top:12px">要換板子：按上方「新的一局」。</div>
      </div>
      ${b.roleInfo ? `<div class="card rules"><h3>角色技能</h3>
        <h4 class="wolf-side">狼人陣營</h4>${info(b.roleInfo.wolf)}
        <h4 class="good-side">好人陣營</h4>${info(b.roleInfo.good)}
      </div>` : ''}
      ${b.night ? `<div class="card rules"><h3>夜晚睜眼順序</h3>
        ${b.night.all ? `<h4>每晚</h4><div class="order">${esc(b.night.all)}</div>` : `
        <h4>首夜</h4><div class="order">${esc(b.night.first)}</div>
        <h4>次夜起</h4><div class="order">${esc(b.night.next)}</div>`}
      </div>` : ''}
      <div class="card rules"><h3>獲勝條件</h3>
        <h4 class="wolf-side">狼人</h4><div class="order">${esc(b.win.wolf)}</div>
        <h4 class="good-side">好人</h4><div class="order">${esc(b.win.good)}</div>
      </div>
      <div class="sheet-foot"><button class="on" id="sheetClose">關閉</button></div>`;
  }
  $('rulesBtn').addEventListener('click', () => {
    openSheet(rulesHTML());
    $('sheetClose').onclick = closeSheet;
  });

  $('newGameBtn').addEventListener('click', () => {
    let boardId = game.board;
    openSheet(`
      <h3>開始新的一局？</h3>
      <p class="hint">每一天的塗鴉和圖章都會清空，回到第 1 天。</p>
      <div class="field-label">板子（📖 板子 會顯示這個板子的規則）</div>
      <div class="opt-group" id="ngBoard">
        ${Object.entries(BOARDS).map(([id, b]) => `<button data-board="${id}" class="${id === boardId ? 'on' : ''}">${esc(b.name)}</button>`).join('')}
      </div>
      <div class="sheet-foot">
        <button id="ngCancel">取消</button>
        <button id="ngGo" style="color:#11131c;background:var(--wolf);border-color:var(--wolf);font-weight:600">清空並開始</button>
      </div>`);
    $('ngBoard').onclick = (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      boardId = b.dataset.board;
      [...$('ngBoard').children].forEach((x) => x.classList.toggle('on', x === b));
    };
    $('ngCancel').onclick = closeSheet;
    $('ngGo').onclick = () => {
      game = { board: boardId, day: 1 };
      pages = {};
      Object.keys(history).forEach((k) => delete history[k]);
      saveGame();
      savePages();
      renderHeader();
      renderPage();
      closeSheet();
    };
  });

  // ---------- privacy cover ----------
  $('hideBtn').addEventListener('click', () => $('cover').classList.add('open'));
  let lastTap = 0;
  $('cover').addEventListener('click', () => {
    const now = Date.now();
    if (now - lastTap < 400) $('cover').classList.remove('open');
    lastTap = now;
  });

  // ---------- keep screen awake ----------
  async function requestWake() {
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible') await navigator.wakeLock.request('screen');
    } catch (e) { /* not supported or denied */ }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') requestWake(); });
  document.addEventListener('pointerdown', function once() { requestWake(); document.removeEventListener('pointerdown', once); });

  // ---------- start ----------
  if ('ResizeObserver' in window) new ResizeObserver(sizeCanvas).observe($('canvasWrap'));
  window.addEventListener('resize', sizeCanvas);
  renderHeader();
  sizeCanvas();
  renderPage();
})();
</script>
</body>
</html>
