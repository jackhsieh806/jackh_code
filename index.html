<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#faf7ef">
    <title>菜單生活記事本</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="icon-button" id="backButton" type="button" aria-label="返回">
          <span aria-hidden="true">←</span>
        </button>
        <div>
          <p class="eyebrow" id="crumbLabel">本機資料</p>
          <h1 id="pageTitle">菜單生活記事本</h1>
        </div>
        <button class="icon-button" id="toolsButton" type="button" aria-label="工具">
          <span aria-hidden="true">☰</span>
        </button>
      </header>

      <main>
        <section class="search-band" aria-label="搜尋">
          <label class="search-field">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="搜尋主題、分類、名稱或內容">
          </label>
        </section>
        <section id="content" class="content" aria-live="polite"></section>
      </main>
    </div>

    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-panel">
        <div class="drawer-header">
          <div>
            <p class="eyebrow">工具</p>
            <h2>資料管理</h2>
          </div>
          <button class="icon-button" id="closeDrawerButton" type="button" aria-label="關閉">×</button>
        </div>
        <div class="drawer-body">
          <button class="primary-action" id="newItemButton" type="button">新增資料</button>

          <div class="settings-card">
            <p class="eyebrow">Google Sheets</p>
            <label>Apps Script Web App URL
              <input id="googleScriptUrl" type="url" readonly>
            </label>
            <label>通行碼
              <input id="googlePasscode" type="password" readonly>
            </label>
            <div class="settings-actions">
              <button class="secondary-action" id="syncGoogleButton" type="button">同步資料</button>
            </div>
            <p class="sync-status" id="syncStatus">正在準備同步設定。</p>
          </div>

          <button class="secondary-action" id="downloadCurrentButton" type="button">匯出目前 Excel</button>
          <a class="secondary-action" href="google-apps-script.js" download>下載 Apps Script</a>
          <a class="secondary-action" href="data.xlsx" download>下載範例 Excel</a>
          <label class="file-loader">
            <span>匯入既有 Excel</span>
            <input id="excelInput" type="file" accept=".xlsx,.xls">
          </label>
        </div>
      </div>
    </aside>

    <div class="modal" id="editorModal" aria-hidden="true">
      <form class="editor-panel" id="editorForm">
        <div class="editor-header">
          <div>
            <p class="eyebrow" id="editorModeLabel">新增</p>
            <h2 id="editorTitle">資料編輯</h2>
          </div>
          <button class="icon-button" id="closeEditorButton" type="button" aria-label="關閉">×</button>
        </div>
        <div class="editor-body">
          <input id="editId" name="id" type="hidden">
          <div class="form-grid form-grid-main">
            <label>名稱
              <input name="title" required placeholder="例如：三杯雞">
            </label>
            <label>內容
              <textarea name="content" rows="9" placeholder="請輸入內容"></textarea>
            </label>
          </div>

          <button class="secondary-action collapsed-toggle" id="advancedToggleButton" type="button">展開進階欄位</button>

          <div class="form-grid is-collapsed" id="advancedFields">
            <label>大主題
              <select name="theme_select" id="themeSelect"></select>
            </label>
            <label class="custom-input-row is-hidden" id="themeCustomRow">自訂大主題
              <input name="theme_custom" id="themeCustomInput" placeholder="輸入新大主題">
            </label>
            <label>分類
              <select name="category_select" id="categorySelect"></select>
            </label>
            <label class="custom-input-row is-hidden" id="categoryCustomRow">自訂分類
              <input name="category_custom" id="categoryCustomInput" placeholder="輸入新分類">
            </label>
            <label>更新日期
              <input name="updated_at" type="date">
            </label>
          </div>
        </div>
        <div class="editor-actions">
          <button class="secondary-action" id="archiveButton" type="button">封存</button>
          <button class="primary-action" type="submit">儲存</button>
        </div>
      </form>
    </div>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
